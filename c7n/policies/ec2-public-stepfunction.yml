policies:
  - name: ec2-public-instances-stepfunction-remediation
    description: |
      Detect public EC2 instances and invoke Step Function for automated remediation workflow.
      This policy triggers a Step Function that handles notification, tagging, and remediation
      of publicly accessible EC2 instances.
    resource: aws.ec2
    mode:
      type: cloudtrail
      events:
        - RunInstances
      role: arn:aws:iam::{account_id}:role/cloud-custodian-stepfunction-role
    filters:
      - type: value
        key: State.Name
        value: running
      # Check for instances with public IP addresses
      - type: value
        key: PublicIpAddress
        value: not-null
    actions:
      - type: invoke-sfn
        state-machine: arn:aws:states:{region}:{account_id}:stateMachine:EC2PublicInstanceRemediation

  - name: ec2-public-instances-periodic-check
    description: |
      Periodic check for public EC2 instances using Step Function remediation.
      Runs every 6 hours to catch instances that may have been missed by real-time monitoring.
    resource: aws.ec2
    mode:
      type: periodic
      schedule: "rate(6 hours)"
      role: arn:aws:iam::{account_id}:role/cloud-custodian-stepfunction-role
    filters:
      - type: value
        key: State.Name
        value: running
      # Check for instances with public IP addresses
      - type: value
        key: PublicIpAddress
        value: not-null
      # Only process instances that haven't been processed recently
      - type: value
        key: "Tags[?Key == 'custodian:stepfunction-processed'] | length(@)"
        value: 0
    actions:
      - type: invoke-sfn
        state-machine: arn:aws:states:{region}:{account_id}:stateMachine:EC2PublicInstanceRemediation