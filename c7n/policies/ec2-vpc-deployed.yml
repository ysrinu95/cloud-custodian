policies:
  - name: ec2-public-ip-vpc-deployed
    description: |
      Event-driven policy deployed inside VPC for enhanced security.
      Automatically terminates EC2 instances launched with public IP addresses.
      This policy demonstrates Cloud Custodian Lambda deployment within a VPC.
    
    resource: aws.ec2
    
    mode:
      type: cloudtrail
      events:
        - source: ec2.amazonaws.com
          event: RunInstances
          ids: "responseElements.instancesSet.items[].instanceId"
      
      # IAM role for Lambda execution
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      
      # Lambda configuration
      timeout: 300
      memory: 512
      
      # VPC Configuration - Deploy Lambda inside VPC
      security_groups:
        - sg-004a339bd507bdf3d  # custodian-lambda-vpc-sg
      
      subnets:
        - subnet-078ba3325fba95239  # us-east-1d - 172.31.32.0/20
        - subnet-06556a45241026af5  # us-east-1e - 172.31.48.0/20
      
      # Lambda function tags
      tags:
        Environment: production
        VPCDeployed: "true"
        DeploymentType: vpc-lambda
        SecurityCompliance: enhanced
        ManagedBy: cloud-custodian
        CostCenter: security-operations
    
    # Filter: Only process instances with public IP addresses
    filters:
      - type: value
        key: PublicIpAddress
        value: not-null
      
      - type: value
        key: State.Name
        value: running
    
    # Actions: Terminate non-compliant instances and notify
    actions:
      - type: terminate
        force: true
      
      - type: notify
        template: default.html
        priority_header: '1'
        subject: "[Cloud Custodian] EC2 Instance Terminated - Public IP Violation (VPC-Deployed Policy)"
        to:
          - security-team@example.com
        transport:
          type: sqs
          queue: https://sqs.us-east-1.amazonaws.com/172327596604/cloud-custodian-mailer

  - name: ec2-untagged-instances-vpc-periodic
    description: |
      Periodic policy running inside VPC.
      Scans all EC2 instances daily for missing required tags.
      Demonstrates scheduled VPC-deployed Lambda function.
    
    resource: aws.ec2
    
    mode:
      type: periodic
      schedule: "rate(1 day)"
      
      # IAM role for Lambda execution
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      
      # Lambda configuration
      timeout: 600
      memory: 1024
      
      # VPC Configuration
      security_groups:
        - sg-004a339bd507bdf3d
      
      subnets:
        - subnet-078ba3325fba95239
        - subnet-06556a45241026af5
      
      tags:
        Environment: production
        VPCDeployed: "true"
        ScheduleType: periodic
        ScanType: compliance
    
    filters:
      - type: value
        key: State.Name
        value: running
      
      # Check for missing required tags
      - or:
          - tag:CostCenter: absent
          - tag:Owner: absent
          - tag:Application: absent
    
    actions:
      - type: tag
        key: ComplianceStatus
        value: NonCompliant-MissingTags
      
      - type: tag
        key: LastScanned
        value: |-
          {now:%Y-%m-%d}
      
      - type: notify
        template: default.html
        subject: "[Cloud Custodian] EC2 Instances Missing Required Tags"
        to:
          - operations@example.com
        transport:
          type: sqs
          queue: https://sqs.us-east-1.amazonaws.com/172327596604/cloud-custodian-mailer
