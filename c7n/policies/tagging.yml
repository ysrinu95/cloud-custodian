# https://cloudcustodian.io/docs/aws/examples/tagcompliance.html
# https://cloudcustodian.io/docs/tools/c7n-trailcreator.html
# https://cloudcustodian.io/docs/aws/examples/ec2-auto-tag-user.html

vars:
  tags: &tags
    contact: ysrinu95@gmail.com
    environment: "production"
    repo: ysrinu95/cloud-custodian
  auto-tag: &auto-tag
    filters:
      - tag:c7n:created-by: absent
    actions:
      - type: auto-tag-user
        tag: 'c7n:created-by'
        principal_id_tag: 'c7n:created-by-principal'
  temp-condition: &temp-condition # only run in shared account
    - type: value
      key: account_id
      op: in
      value: ["YOUR_AWS_ACCOUNT_ID"]


policies:
- name: aws-acm-auto-tag-user
  resource: aws.acm-certificate
  description: |
    Auto-tags ACM resources with creator info
  mode:
    type: cloudtrail
    role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
    events:
      - source: acm.amazonaws.com
        event: RequestCertificate
        ids: requestParameters.domainName
    tags: *tags
  <<: *auto-tag

- name: aws-ami-auto-tag-user
  resource: aws.ami
  description: |
    Auto-tags AMI resources with creator info
