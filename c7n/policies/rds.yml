vars:
  tags: &tags
    contact: ysrinu95@gmail.com
    environment: "engg"
    repo: devops/cloud-custodian/c7n
  email-notify: &email-notify
    template: aws-basic_email.html
    to:
      - ysrinu95@gmail.com
      - event-owner
      - resource-owner
    transport:
      type: sqs
      queue: https://sqs.us-east-1.amazonaws.com/172327596604/custodian-mailer-queue 

policies:
  - name: aws-rds-stop-public-db-instances
    resource: aws.rds
    description: |
      Notifies of and stops RDS DB instances launched as publicly accessible
    mode:
      type: cloudtrail
      events:
        - CreateDBInstance
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags
    filters:
      - type: value
        key: PubliclyAccessible
        value: true
    actions:
      - type: stop
      - type: notify
        <<: *email-notify
        priority_header: 1
        subject: "[c7n] [{{ account }}] Public RDS DB Instances Launched ({{ region }})"
        violation_desc: RDS DB instance launched with public access
        action_desc: |
          Actions taken: The violating RDS DB instance has been stopped. <br>
          No RDS DB Instances should be exposed to public. <br>

  - name: aws-rds-engine-version-upgrade-available
    resource: aws.rds
    description: |
      Notifies of RDS instances with engine upgrades available
    mode:
      type: periodic
      schedule: cron(0, 23, ?, *, SUN, *) # every Sunday at 23:00 UTC
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags
    filters:
      - type: upgrade-available
        major: true # list major versions available
      # - type: engine
      #   key: Status
      #   value: available
    actions:
      - type: notify
        <<: *email-notify
        subject: "[c7n] [{{ account }}] RDS Engine Upgrade Available ({{ region }})"
        violation_desc: RDS database engine upgrade available
        action_desc: |
          Please upgrade the database engine version.
          
  - name: aws-rds-snapshot-old
    resource: rds-snapshot
    description: |
      Notifies of and deletes old RDS instance manual snapshots
    mode:
      type: periodic
      schedule: cron(0, 23, ?, *, SUN, *) # every Sunday at 23:00 UTC
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags      
    filters:    
      - type: value
        key: SnapshotType
        value: manual
        op: eq    
      - type: age
        days: 90
        op: ge
      - tag:c7n-exception:retention: absent        
    actions:
      - delete
      - type: notify
        <<: *email-notify
        priority_header: 1
        subject: "[c7n] [{{ account }}] RDS Instance Snapshots older than 90 days ({{ region }})"
        violation_desc: RDS Snapshots older than 90 days
        action_desc: |
          Actions taken: RDS Instance Snapshots older than 90 days have been deleted. <br>

  - name: aws-rds-cluster-snapshot-old
    resource: rds-cluster-snapshot
    description: |
      Notifies of and deletes old RDS cluster manual snapshots
    mode:
      type: periodic
      schedule: cron(0, 23, ?, *, SUN, *) # every Sunday at 23:00 UTC
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags      
    filters:
      - type: value
        key: SnapshotType
        value: manual
        op: eq    
      - type: age
        days: 90
        op: ge
      - tag:c7n-exception:retention: absent        
    actions:
      - delete
      - type: notify
        <<: *email-notify
        priority_header: 1
        subject: "[c7n] [{{ account }}] RDS Cluster Snapshots older than 90 days ({{ region }})"
        violation_desc: RDS Snapshots older than 90 days
        action_desc: |
          Actions taken: RDS Cluster Snapshots older than 90 days have been deleted. <br>          
