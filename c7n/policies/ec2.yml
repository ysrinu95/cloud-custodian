vars:
  tags: &tags
    contact: ysrinu95@gmail.com
    environment: "{environment}"
    repo: devops/cloud-custodian/c7n
  email-notify: &email-notify
    template: aws-basic_email.html
    to:
      - ysrinu95@gmail.com
      - event-owner
      - resource-owner
    transport:
      type: sqs
      queue: https://sqs.us-east-1.amazonaws.com/172327596604/custodian-mailer-queue

policies:
  - name: aws-ec2-public-ips
    resource: aws.ec2
    description: |
      Notifies of instances found with a public IP address
    mode:
      type: periodic
      schedule: cron(0, 23, ?, *, SUN, *) # every Sunday at 23:00 UTC
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags
    filters:
      - type: value
        key: PublicIpAddress
        value: present
    actions:
      - type: notify
        <<: *email-notify
        subject: "[c7n] [{{ account }}] EC2 Instances With Public IP Report ({{ region }})"
        violation_desc: EC2 instances with a public IP address
        action_desc: |
          No action taken. EC2 instances should be on private subnets.

  - name: aws-ec2-stop-public-instances
    resource: aws.ec2
    description: |
      Notifies of and stops EC2 instances launched in a public subnet
    mode:
      type: cloudtrail
      events:
        - RunInstances
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags
    filters:
      - type: event
        key: detail.requestParameters.networkInterfaceSet.items[].associatePublicIpAddress
        value: true
    actions:
      - type: stop
        force: true
      - type: notify
        <<: *email-notify
        priority_header: 1
        subject: "[c7n] [{{ account }}] Public EC2 Instance Launched ({{ region }})"
        violation_desc: EC2 instance launched in a public subnet
        action_desc: |
          Actions taken: The violating EC2 instance has been stopped. <br>
          To expose an application or service publicly, a load balancer should be placed
          in a public subnet which routes the traffic internally. <br>          
          <a href="https://docs.aws.amazon.com/securityhub/latest/userguide/securityhub-standards-fsbp-controls.html#ec2-9-remediation">Documentation</a> 

