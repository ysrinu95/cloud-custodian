vars:
  tags: &tags
    contact: ysrinu95@gmail.com
    environment: "production"
    repo: ysrinu95/cloud-custodian
  email-notify: &email-notify
    template: aws-basic_email.html
    to:
      - ysrinu95@gmail.com
      - event-owner
      - resource-owner
    transport:
      type: sqs
      queue: https://sqs.us-west-2.amazonaws.com/172327596604/custodian-mailer-queue
      
policies:  
  - name: aws-elb-outdated-tls-protocols
    resource: app-elb
    description: |
      Notifies on usage of outdated TLS protocols
    mode:
      type: periodic
      schedule: cron(0, 23, ?, *, SUN, *) # every Sunday at 23:00 UTC
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags      
    filters:
      - type: listener
        key: Protocol
        value: HTTPS
      - type: listener
        key: SslPolicy
        value: ['ELBSecurityPolicy-TLS-1-1-2017-01','ELBSecurityPolicy-TLS13-1-1-2021-06','ELBSecurityPolicy-TLS13-1-0-2021-06','ELBSecurityPolicy-2016-08','ELBSecurityPolicy-2015-05']
        op: in
    actions:
      - type: notify
        <<: *email-notify
        priority_header: 1
        subject: "[c7n] [{{ account }}] Outdated ALB TLS protocols found ({{ region }})"
        violation_desc: Outdated TLS Protocol is configured on ALB
        action_desc: |
          An outdated SSL TLS policy is configured on the ALB. Please update to a newer policy that does not support TLS 1.2 or 1.3. <br>          
          <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html#tls-protocols">Documentation</a>
  - name: aws-elb-http-listeners-without-https
    resource: app-elb
    description: |
      Notifies on LB HTTP listeners in use that do not redirect to HTTPS
    mode:
      type: periodic
      schedule: cron(0, 23, ?, *, SUN, *) # every Sunday at 23:00 UTC
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      tags: *tags
    filters:
      - type: value
        key: Scheme
        value: internet-facing    #todo: eventually migrate all internal LB's to HTTPS    
      - type: listener
        key: Protocol
        value: HTTP
      - type: listener
        matched: true
        key: 'DefaultActions[].RedirectConfig.Protocol'
        value: [HTTPS]
        op: ne
    actions:
      - type: notify
        <<: *email-notify
        priority_header: 1
        subject: "[c7n] [{{ account }}] LB HTTP Listeners in use that do not redirect to HTTPS found ({{ region }})"
        violation_desc: LB HTTP Listeners in use that do not redirected to HTTPS
        action_desc: |
          LB HTTP Listeners in use that do not redirected to HTTPS. Please configure HTTPS or redirect HTTP to HTTPS.       
          <a href="https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-listeners.html#listener-configuration">Documentation</a>          

  - name: aws-elb-create-internet-facing-load-balancer
    resource: aws.app-elb
    description: |
      Notifies on creation of an internet-facing load balancer
    mode:
      type: cloudtrail
      role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
      events:
        - source: elasticloadbalancing.amazonaws.com
          event: CreateLoadBalancer
          ids: responseElements.loadBalancers[].loadBalancerArn
    filters:
      - type: event
        key: "detail.requestParameters.scheme"
        op: eq
        value: "internet-facing"            
    actions:
      - type: notify
        <<: *email-notify
        violation_desc: |
          Internet Facing Load Balancer is created
        action_desc: |
          No action taken. Please check that this was intentional.          
