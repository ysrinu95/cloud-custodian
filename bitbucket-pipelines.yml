              - c7n/**
        script:
          - cd ${BITBUCKET_CLONE_DIR}/c7n
          - *install_c7n
          - mkdir -p ${BITBUCKET_CLONE_DIR}/artifacts/c7n-deploy/development
          - *assume_role_cloud_admin_shared
          - ./scripts/deploy-updated-policies.sh -a development
        artifacts:
          - artifacts/c7n-deploy/**
    - step: &c7n_deploy_staging
        name: custodian deploy staging
        oidc: true
        trigger: manual
        services:
          - docker
        condition:
          changesets:
            includePaths:
              - bitbucket-pipelines.yml
              - c7n/**
        script:
          - cd ${BITBUCKET_CLONE_DIR}/c7n
          - *install_c7n
          - mkdir -p ${BITBUCKET_CLONE_DIR}/artifacts/c7n-deploy/staging
          - *assume_role_cloud_admin_shared
          - ./scripts/deploy-updated-policies.sh -a staging
        artifacts:
          - artifacts/c7n-deploy/**
    - step: &c7n_deploy_production
        name: custodian deploy production
        oidc: true
        trigger: manual
        services:
          - docker
        condition:
          changesets:
            includePaths:
              - bitbucket-pipelines.yml
              - c7n/**
        script:
          - cd ${BITBUCKET_CLONE_DIR}/c7n
          - *install_c7n
          - mkdir -p ${BITBUCKET_CLONE_DIR}/artifacts/c7n-deploy/production
          - *assume_role_cloud_admin_shared
          - ./scripts/deploy-updated-policies.sh -a production
        artifacts:
          - artifacts/c7n-deploy/**

    # Docs steps
    - step: &publish_docs
        name: publish docs
        oidc: true
        condition:
          changesets:
            includePaths:
              - bitbucket-pipelines.yml
              - docs/**
        script:
          - *bootstrap_greenstreet_utils
          - export ENVIRONMENT=development
          - source ${BITBUCKET_CLONE_DIR}/scripts/assume_aws_role.sh "arn:aws:iam::793362518373:role/devops/cloud-admin"
          - ssk docs -s DEVOPS -dr ${BITBUCKET_CLONE_DIR}/docs -cd ${BITBUCKET_CLONE_DIR}/docs/config -p
          - source ${BITBUCKET_CLONE_DIR}/scripts/reset_aws_role.sh


pipelines:
  pull-requests:
    '**':
      - parallel:
        - step: *plan_infrastructure_root-us-west-2
        - step: *plan_infrastructure_shared-us-west-2
        - step: *plan_infrastructure_audit-us-west-2
        - step: *plan_infrastructure_log-us-west-2
        - step: *plan_infrastructure_development-us-west-2
        - step: *plan_infrastructure_staging-us-west-2
        - step: *plan_infrastructure_production-us-west-2
        - step: *c7n_validate_pr
  branches:
    # '**':
    main:
      - step: *publish_docs
      - parallel:
        - step: *plan_infrastructure_root-us-west-2
        - step: *plan_infrastructure_shared-us-west-2
        - step: *plan_infrastructure_audit-us-west-2
        - step: *plan_infrastructure_log-us-west-2
        - step: *plan_infrastructure_development-us-west-2
        - step: *plan_infrastructure_staging-us-west-2
        - step: *plan_infrastructure_production-us-west-2
        - step: *c7n_validate
      - parallel:
        - step:
            <<: *apply_infrastructure
            name: apply infrastructure root-us-west-2
            deployment: root-us-west-2
        - step:
            <<: *apply_infrastructure
            name: apply infrastructure shared-us-west-2
            deployment: shared-us-west-2
        - step:
            <<: *apply_infrastructure
            name: apply infrastructure audit-us-west-2
            deployment: audit-us-west-2
        - step:
            <<: *apply_infrastructure
            name: apply infrastructure log-us-west-2
            deployment: log-us-west-2
        - step:
            <<: *apply_infrastructure
            name: apply infrastructure development-us-west-2
            deployment: development-us-west-2
        - step:
            <<: *apply_infrastructure
            name: apply infrastructure staging-us-west-2
            deployment: staging-us-west-2
        - step:
            <<: *apply_infrastructure
            name: apply infrastructure production-us-west-2
            deployment: production-us-west-2
        - step: *c7n_deploy_mailer
        - step: *c7n_deploy_root
        - step: *c7n_deploy_shared
        - step: *c7n_deploy_audit
        - step: *c7n_deploy_log
        - step: *c7n_deploy_development
        - step: *c7n_deploy_staging
        - step: *c7n_deploy_production


  # Custom pipelines for clean up
  custom:
    deploy-all-policies:
      - variables:
          - name: ACCOUNT_NAME
            default: development
            allowed-values:
              - development
              - staging
              - production
              - shared
              - audit
              - log
              - root

      - step:
          name: custodian deploy all policies to account
          oidc: true
          services:
            - docker
          script:
            - cd ${BITBUCKET_CLONE_DIR}/c7n
            - *install_c7n
            - mkdir -p ${BITBUCKET_CLONE_DIR}/artifacts/c7n-deploy/${ACCOUNT_NAME}
            - *assume_role_cloud_admin_shared
            - ./scripts/deploy-policies.sh -a ${ACCOUNT_NAME}
          artifacts:
            - artifacts/c7n-deploy/**

    garbage-collection-dry-run:
      - step:
          name: clean orphaned policy resources (dry run)
          oidc: true
          services:
            - docker
          script:
            - cd ${BITBUCKET_CLONE_DIR}/c7n
            - *install_c7n
            - mkdir -p ${BITBUCKET_CLONE_DIR}/artifacts/c7n-cleanup
            - *assume_role_cloud_admin_shared
            - ./scripts/clean-removed-policies.sh -d
          artifacts:
            - artifacts/c7n-cleanup/**

    garbage-collection:
      - step:
          name: clean orphaned policy resources
          oidc: true
          services:
            - docker
          script:
            - cd ${BITBUCKET_CLONE_DIR}/c7n
            - *install_c7n
            - mkdir -p ${BITBUCKET_CLONE_DIR}/artifacts/c7n-cleanup
            - *assume_role_cloud_admin_shared
            - ./scripts/clean-removed-policies.sh
          artifacts:
            - artifacts/c7n-cleanup/**

    publish-docs:
      - step: 
          <<: *publish_docs
          condition: *all_changes
