name: Deploy Cloud Custodian Lambda Functions

on:
  workflow_dispatch:
    inputs:
      deployment_action:
        description: 'Lambda deployment action'
        required: true
        default: 'deploy'
        type: choice
        options:
        - deploy
        - update
        - remove
      policy_path:
        description: 'Path to Cloud Custodian policy files'
        required: false
        default: 'c7n/policies'
        type: string
      lambda_timeout:
        description: 'Lambda function timeout (seconds)'
        required: false
        default: '300'
        type: string
      lambda_memory:
        description: 'Lambda function memory (MB)'
        required: false
        default: '512'
        type: string

env:
  AWS_REGION: 'us-east-1'
  PYTHON_VERSION: '3.11'

jobs:
  deploy-lambda:
    name: 'Deploy Lambda Functions'
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-CloudCustodian-Lambda-${{ github.run_number }}
      
      - name: Verify AWS Connection
        run: |
          echo "🔍 Verifying AWS connection..."
          aws sts get-caller-identity
          echo "✅ AWS connection verified"
      
      - name: Install Cloud Custodian
        run: |
          echo "📦 Installing Cloud Custodian..."
          pip install --upgrade pip
          pip install 'c7n>=0.9.40' PyYAML
          echo "✅ Cloud Custodian installation complete"
          echo "📋 Installed version:"
          custodian version
      
      - name: Validate Policy Files
        run: |
          echo "🔍 Validating Cloud Custodian policies..."
          find ${{ github.event.inputs.policy_path }} -name "*.yml" -o -name "*.yaml" | while read policy_file; do
            echo "  Validating: $policy_file"
            custodian validate "$policy_file"
          done
          echo "✅ All policies validated successfully"
      
      - name: Get Lambda Execution Role ARN
        id: lambda_role
        run: |
          echo "🔍 Getting Lambda execution role ARN..."
          ROLE_ARN=$(aws iam get-role --role-name CloudCustodian-Lambda-ExecutionRole --query 'Role.Arn' --output text 2>/dev/null || echo "")
          
          if [ -z "$ROLE_ARN" ]; then
            echo "❌ Lambda execution role not found. Please ensure the infrastructure is deployed first."
            echo "Run the 'Deploy Cloud Custodian Infrastructure' workflow first."
            exit 1
          fi
          
          echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
          echo "✅ Lambda execution role found: $ROLE_ARN"
      
      - name: Prepare Lambda Policies
        if: github.event.inputs.deployment_action == 'deploy' || github.event.inputs.deployment_action == 'update'
        env:
          LAMBDA_ROLE_ARN: ${{ steps.lambda_role.outputs.role_arn }}
        run: |
          echo "🔧 Preparing policies for Lambda deployment..."
          echo "🔧 Using Lambda Role: $LAMBDA_ROLE_ARN"
          
          # Create Python script to inject role ARN into policies
          cat > inject_role.py << 'EOF'
          import sys
          import yaml
          import os
          
          role_arn = os.environ['LAMBDA_ROLE_ARN']
          input_file = sys.argv[1]
          output_file = sys.argv[2]
          
          with open(input_file, 'r') as f:
              data = yaml.safe_load(f)
          
          # Add role to policies with mode configuration
          modified = False
          for policy in data.get('policies', []):
              if 'mode' in policy:
                  policy['mode']['role'] = role_arn
                  print(f"✅ Added role to policy: {policy['name']}")
                  modified = True
          
          with open(output_file, 'w') as f:
              yaml.dump(data, f, default_flow_style=False, sort_keys=False)
          
          if modified:
              print(f"📝 Modified and saved: {input_file} -> {output_file}")
          else:
              print(f"📋 No Lambda policies found in: {input_file}")
          EOF
          
          # Create temporary directory for modified policies
          mkdir -p lambda-policies
          
          # Process each policy file
          find ${{ github.event.inputs.policy_path }} -name "*.yml" -o -name "*.yaml" | while read policy_file; do
            echo ""
            echo "📝 Processing: $policy_file"
            temp_file="lambda-policies/$(basename "$policy_file")"
            python inject_role.py "$policy_file" "$temp_file"
          done
          
          echo ""
          echo "✅ All policies prepared for Lambda deployment"

      - name: Deploy Lambda Functions
        if: github.event.inputs.deployment_action == 'deploy' || github.event.inputs.deployment_action == 'update'
        run: |
          echo "🚀 Deploying Cloud Custodian policies as Lambda functions..."
          
          # Deploy each prepared policy file
          find lambda-policies -name "*.yml" -o -name "*.yaml" | while read policy_file; do
            echo ""
            echo "📦 Deploying policy file: $policy_file"
            
            # Check if policy has mode (Lambda deployment)
            if grep -q "mode:" "$policy_file"; then
              echo "  Lambda mode policy - deploying as Lambda function"
              custodian run \
                --output-dir lambda-output \
                "$policy_file"
            else
              echo "  Standard policy - running dry-run validation"
              custodian run \
                --dryrun \
                --output-dir lambda-output \
                "$policy_file"
            fi
            
            echo "✅ Processed policy file: $policy_file"
          done
          
          echo ""
          echo "🎉 All Lambda functions deployed successfully!"
      
      - name: List Deployed Lambda Functions
        if: github.event.inputs.deployment_action == 'deploy' || github.event.inputs.deployment_action == 'update'
        run: |
          echo "📋 Listing deployed Cloud Custodian Lambda functions..."
          
          # List Lambda functions with custodian prefix
          aws lambda list-functions \
            --query 'Functions[?starts_with(FunctionName, `custodian-`)].{Name:FunctionName,Runtime:Runtime,Timeout:Timeout,Memory:MemorySize,LastModified:LastModified}' \
            --output table
          
          echo ""
          echo "📋 Listing CloudWatch Event Rules for triggers..."
          
          # List CloudWatch Event Rules for custodian
          aws events list-rules \
            --query 'Rules[?starts_with(Name, `custodian-`)].{Name:Name,State:State,ScheduleExpression:ScheduleExpression}' \
            --output table
      
      - name: Remove Lambda Functions
        if: github.event.inputs.deployment_action == 'remove'
        run: |
          echo "🗑️ Removing Cloud Custodian Lambda functions..."
          
          # Get all custodian Lambda functions
          FUNCTIONS=$(aws lambda list-functions --query 'Functions[?starts_with(FunctionName, `custodian-`)].FunctionName' --output text)
          
          if [ -z "$FUNCTIONS" ]; then
            echo "ℹ️ No Cloud Custodian Lambda functions found to remove"
          else
            echo "Found Lambda functions to remove:"
            for func in $FUNCTIONS; do
              echo "  - $func"
              aws lambda delete-function --function-name "$func"
              echo "✅ Removed: $func"
            done
          fi
          
          # Remove CloudWatch Event Rules
          echo ""
          echo "🗑️ Removing CloudWatch Event Rules..."
          RULES=$(aws events list-rules --query 'Rules[?starts_with(Name, `custodian-`)].Name' --output text)
          
          if [ -z "$RULES" ]; then
            echo "ℹ️ No Cloud Custodian Event Rules found to remove"
          else
            for rule in $RULES; do
              echo "  Removing rule: $rule"
              # Remove targets first
              aws events remove-targets --rule "$rule" --ids "1" 2>/dev/null || true
              # Delete rule
              aws events delete-rule --name "$rule"
              echo "✅ Removed rule: $rule"
            done
          fi
          
          echo "🎉 Cleanup completed!"
      
      - name: Upload Lambda Deployment Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lambda-deployment-logs-${{ github.run_number }}
          path: lambda-output/
          retention-days: 30
      
      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "🚀 Cloud Custodian Lambda Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "=============================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: ${{ github.event.inputs.deployment_action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Policy Path**: ${{ github.event.inputs.policy_path }}" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda Timeout**: ${{ github.event.inputs.lambda_timeout }} seconds" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda Memory**: ${{ github.event.inputs.lambda_memory }} MB" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.deployment_action }}" != "remove" ]; then
            echo "## 🎯 Deployed Lambda Functions" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Count deployed functions
            FUNCTION_COUNT=$(aws lambda list-functions --query 'Functions[?starts_with(FunctionName, `custodian-`)]' --output text | wc -l)
            echo "**Total Functions Deployed**: $FUNCTION_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "## ⚡ Event-Driven Features" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Real-time AWS resource monitoring**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Automatic policy enforcement**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **CloudWatch Events integration**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **SNS notifications for violations**" >> $GITHUB_STEP_SUMMARY
            echo "- ✅ **Detailed CloudWatch logging**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "## 📊 Monitoring & Logs" >> $GITHUB_STEP_SUMMARY
            echo "- **CloudWatch Logs**: \`/aws/lambda/custodian-*\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Lambda Console**: [AWS Lambda Functions](https://console.aws.amazon.com/lambda/home?region=${{ env.AWS_REGION }}#/functions)" >> $GITHUB_STEP_SUMMARY
            echo "- **CloudWatch Events**: [Event Rules](https://console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#rules:)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 🗑️ Cleanup Completed" >> $GITHUB_STEP_SUMMARY
            echo "All Cloud Custodian Lambda functions and Event Rules have been removed." >> $GITHUB_STEP_SUMMARY
          fi