name: Apply Terraform Permissions Fix

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
        - plan
        - apply

env:
  AWS_REGION: 'us-east-1'

jobs:
  apply-permissions:
    name: 'Apply GitHub Actions Terraform Permissions'
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '>=1.6'
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform-Permissions-${{ github.run_number }}
      
      - name: Verify AWS Connection
        run: |
          echo "🔍 Verifying AWS connection..."
          aws sts get-caller-identity
          echo "✅ AWS connection verified"
      
      - name: Check Current Permissions
        run: |
          echo "🔍 Checking current IAM permissions..."
          
          # List attached policies for GitHubActions role
          echo "📋 Currently attached policies to GitHubActions-CloudCustodian-Role:"
          aws iam list-attached-role-policies --role-name GitHubActions-CloudCustodian-Role
          
          # Check CloudCustodian execution role
          echo "📋 Currently attached policies to CloudCustodian-ExecutionRole:"
          aws iam list-attached-role-policies --role-name CloudCustodian-ExecutionRole
      
      - name: Bootstrap Permission Fix for Terraform Operations
        if: github.event.inputs.action == 'apply'
        run: |
          echo "🔧 Bootstrap Permission Fix - Adding temporary comprehensive policy..."
          
          # Create comprehensive temporary policy for Terraform operations
          cat > temp_terraform_policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "iam:*",
                  "s3:*",
                  "sqs:*",
                  "ses:*",
                  "sns:*",
                  "logs:*",
                  "cloudwatch:*",
                  "lambda:*",
                  "ec2:Describe*",
                  "ec2:Get*",
                  "ec2:List*",
                  "events:*",
                  "sts:GetCallerIdentity"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF
          
          # Create a unique temporary policy name
          TIMESTAMP=$(date +%s)
          TEMP_POLICY_NAME="TempTerraformPermissions-$TIMESTAMP"
          
          echo "📝 Creating temporary policy: $TEMP_POLICY_NAME"
          TEMP_POLICY_ARN=$(aws iam create-policy \
            --policy-name "$TEMP_POLICY_NAME" \
            --policy-document file://temp_terraform_policy.json \
            --query 'Policy.Arn' \
            --output text)
          
          echo "✅ Created temporary policy: $TEMP_POLICY_ARN"
          
          # Attach the temporary policy to the GitHub Actions role
          echo "🔗 Attaching temporary policy to GitHubActions-CloudCustodian-Role..."
          aws iam attach-role-policy \
            --role-name GitHubActions-CloudCustodian-Role \
            --policy-arn "$TEMP_POLICY_ARN"
          
          echo "✅ Attached temporary policy successfully"
          
          # Wait for permission propagation
          echo "⏳ Waiting 20 seconds for permission propagation..."
          sleep 20
          
          # Store for cleanup
          echo "TEMP_POLICY_ARN=$TEMP_POLICY_ARN" >> $GITHUB_ENV
          echo "🎯 Comprehensive Terraform permissions ready"
      
      - name: Terraform Init
        working-directory: terraform
        run: |
          echo "🔧 Initializing Terraform..."
          terraform init
          echo "✅ Terraform initialized"
      
      - name: Terraform Plan
        working-directory: terraform
        run: |
          echo "📋 Planning Terraform changes..."
          terraform plan -out=tfplan
          echo "✅ Terraform plan completed"
      
      - name: Show Plan Summary
        working-directory: terraform
        run: |
          echo "📊 Terraform Plan Summary:" >> $GITHUB_STEP_SUMMARY
          echo "=========================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Plan Output:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan | head -100 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Also show in console for debugging
          echo "📋 Plan Details:"
          terraform show -no-color tfplan
      
      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform apply -auto-approve tfplan
          echo "✅ Terraform apply completed"
      
      - name: Cleanup Temporary Policy
        if: always() && github.event.inputs.action == 'apply'
        run: |
          echo "🧹 Cleaning up temporary policy..."
          
          if [ -n "$TEMP_POLICY_ARN" ]; then
            echo "🔄 Detaching temporary policy: $TEMP_POLICY_ARN"
            aws iam detach-role-policy \
              --role-name GitHubActions-CloudCustodian-Role \
              --policy-arn "$TEMP_POLICY_ARN" || echo "⚠️ Policy already detached"
            
            echo "🗑️ Deleting temporary policy: $TEMP_POLICY_ARN"
            aws iam delete-policy --policy-arn "$TEMP_POLICY_ARN" || echo "⚠️ Policy already deleted"
            
            echo "✅ Temporary policy cleaned up successfully"
          else
            echo "ℹ️ No temporary policy to clean up"
          fi
      
      - name: Verify Updated Permissions
        if: github.event.inputs.action == 'apply'
        run: |
          echo "🔍 Verifying updated IAM permissions..."
          
          # Check if the GitHub Actions role has the new Terraform policy
          echo "📋 Checking for GitHubActions-Terraform-Policy attachment..."
          aws iam list-attached-role-policies --role-name GitHubActions-CloudCustodian-Role --query 'AttachedPolicies[?PolicyName==`GitHubActions-Terraform-Policy`].PolicyArn' --output text
          
          POLICY_ARN=$(aws iam list-attached-role-policies --role-name GitHubActions-CloudCustodian-Role --query 'AttachedPolicies[?PolicyName==`GitHubActions-Terraform-Policy`].PolicyArn' --output text)
          
          if [ -n "$POLICY_ARN" ]; then
            echo "✅ GitHubActions-Terraform-Policy attached: $POLICY_ARN"
            
            # Check if SQS permissions are included
            aws iam get-policy-version --policy-arn "$POLICY_ARN" --version-id \$(aws iam get-policy --policy-arn "$POLICY_ARN" --query 'Policy.DefaultVersionId' --output text) --query 'PolicyVersion.Document.Statement[].Action' --output json | grep -q "sqs:" && echo "✅ SQS permissions found" || echo "❌ SQS permissions missing"
            
            # Check if SES permissions are included
            aws iam get-policy-version --policy-arn "$POLICY_ARN" --version-id \$(aws iam get-policy --policy-arn "$POLICY_ARN" --query 'Policy.DefaultVersionId' --output text) --query 'PolicyVersion.Document.Statement[].Action' --output json | grep -q "ses:" && echo "✅ SES permissions found" || echo "❌ SES permissions missing"
          else
            echo "❌ GitHubActions-Terraform-Policy not found"
          fi
          
          # Check CloudCustodian-ExecutionRole has Administrator Access
          echo "📋 Checking CloudCustodian-ExecutionRole for Administrator Access..."
          aws iam list-attached-role-policies --role-name CloudCustodian-ExecutionRole --query 'AttachedPolicies[?PolicyName==`AdministratorAccess`].PolicyArn' --output text
          
          ADMIN_POLICY=$(aws iam list-attached-role-policies --role-name CloudCustodian-ExecutionRole --query 'AttachedPolicies[?PolicyName==`AdministratorAccess`].PolicyArn' --output text)
          
          if [ -n "$ADMIN_POLICY" ]; then
            echo "✅ CloudCustodian-ExecutionRole has Administrator Access"
          else
            echo "❌ CloudCustodian-ExecutionRole missing Administrator Access"
          fi
      
      - name: Generate Summary
        if: always()
        run: |
          echo "🔧 Terraform Permissions Application" >> $GITHUB_STEP_SUMMARY
          echo "====================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.action }}" == "apply" ]; then
            echo "## ✅ Applied Changes" >> $GITHUB_STEP_SUMMARY
            echo "- **GitHubActions-Terraform-Policy** - Comprehensive AWS service permissions for Terraform" >> $GITHUB_STEP_SUMMARY
            echo "- **CloudCustodian-ExecutionRole** - Administrator Access for comprehensive Cloud Custodian operations" >> $GITHUB_STEP_SUMMARY
            echo "- **SQS Permissions** - Full SQS access including tagqueue operations" >> $GITHUB_STEP_SUMMARY
            echo "- **SES Permissions** - Full SES access including VerifyEmailIdentity" >> $GITHUB_STEP_SUMMARY
            echo "- **IAM Permissions** - Policy and role management capabilities" >> $GITHUB_STEP_SUMMARY
            echo "- **Lambda Permissions** - Full Lambda management for Cloud Custodian" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "- **Terraform operations should now work** without permission errors" >> $GITHUB_STEP_SUMMARY
            echo "- **Re-run any failed Terraform workflows** to deploy Cloud Custodian infrastructure" >> $GITHUB_STEP_SUMMARY
            echo "- **SQS and SES resources** can now be created successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📋 Plan Only" >> $GITHUB_STEP_SUMMARY
            echo "Run with 'apply' action to update the IAM permissions." >> $GITHUB_STEP_SUMMARY
          fi