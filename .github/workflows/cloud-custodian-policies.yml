name: Cloud Custodian Demo & Policy Management

on:
  workflow_dispatch:
    inputs:
      operation_type:
        description: 'Type of operation to perform'
        required: true
        default: 'validate'
        type: choice
        options:
        # Policy Management
        - validate
        - deploy-updated
        - deploy-all
        - deploy-mailer
        - cleanup
        # Lambda Validation
        - validate-lambdas
        # Verification & Setup
        - verify-deployment
        - complete-setup-validation
        - deployment-report
        # Security Demos (Real AWS Service Integration)
        - demo-guardduty-real
        - demo-config-real
        - demo-securityhub-real
        - demo-macie-real
        - demo-access-analyzer-real
        - demo-s3-access-logs-real
        - demo-cloudtrail-security-real
        - demo-security-summary-real
        - demo-all-security-real
        # Resource Demos
        - demo-ec2-public
        - demo-rds-public
        - demo-ebs-unencrypted
        - demo-step-functions
        # Cleanup Operations
        - cleanup-demo-resources
        - cleanup-security-tests
        - cleanup-comprehensive
        - cleanup-scan
        - cleanup-except-s3
      target_accounts:
        description: 'Target accounts (comma-separated, or "all")'
        required: false
        default: 'engg'
        type: string
      dry_run:
        description: 'Run in dry-run mode (for policy operations)'
        required: false
        default: true
        type: boolean
      regions:
        description: 'Target regions (comma-separated)'
        required: false
        default: 'us-east-1'
        type: string
      monitoring_duration:
        description: 'Monitoring duration for security demos (minutes)'
        required: false
        default: '15'
        type: string
  
  push:
    branches: [main]
    paths:
      - 'c7n/policies/**'
      - 'c7n/scripts/**'
      - '.github/workflows/cloud-custodian-policies.yml'
  
  pull_request:
    paths:
      - 'c7n/policies/**'
      - 'c7n/scripts/**'
      - '.github/workflows/cloud-custodian-policies.yml'

env:
  AWS_REGION: 'us-east-1'
  PYTHON_VERSION: '3.11'

jobs:
  # ==============================================================================
  # Policy Validation and Management Jobs
  # ==============================================================================
  
  validate:
    name: 'Validate Cloud Custodian Policies'
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.operation_type == 'validate' ||
      github.event.inputs.operation_type == 'deploy-updated' ||
      github.event.inputs.operation_type == 'deploy-all' ||
      github.event.inputs.operation_type == 'deploy-mailer' ||
      github.event.inputs.operation_type == 'cleanup' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    outputs:
      validation-passed: ${{ steps.validation.outputs.passed }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-c7n-Validate-${{ github.run_number }}
      
      - name: Install Cloud Custodian and Dependencies
        run: |
          echo "📦 Installing Cloud Custodian ecosystem..."
          pip install --upgrade pip
          
          # Check if requirements.txt exists in expected locations
          if [ -f "c7n/requirements.txt" ]; then
            pip install -r c7n/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            # Fallback: install core components
            echo "⚠️ Requirements file not found, installing core Cloud Custodian components..."
            pip install c7n c7n-org c7n-mailer c7n-left
          fi
          
          # Verify core installation
          echo "✅ Verifying Cloud Custodian installation:"
          custodian version
          echo "✅ Installation complete"
      
      - name: Install Additional Dependencies
        run: |
          echo "🔧 Installing additional dependencies..."
          sudo apt-get update && sudo apt-get install -y jq yq
          echo "✅ Dependencies installed"
      
      - name: Validate Policy Syntax
        id: validation
        run: |
          echo "🔍 Validating Cloud Custodian policy syntax..."
          cd c7n
          
          validation_failed=false
          policy_count=0
          
          # Check for policy files specifically in c7n/policies directory
          POLICY_DIR="policies"
          echo "📁 Looking for policy files in: c7n/policies"
          
          if [ ! -d "$POLICY_DIR" ]; then
            echo "❌ Policy directory not found: c7n/policies"
            echo "💡 Expected policy location: c7n/policies/"
            validation_failed=true
          elif ! ls "$POLICY_DIR"/*.yml 1> /dev/null 2>&1; then
            echo "❌ No policy files (*.yml) found in: c7n/policies"
            echo "💡 Please ensure policy files are placed in c7n/policies/ directory"
            validation_failed=true
          else
            echo "✅ Found policy files in: c7n/policies"
            
            # Validate each policy file in the policies directory
            for policy_file in "$POLICY_DIR"/*.yml; do
              if [ -f "$policy_file" ]; then
                policy_count=$((policy_count + 1))
                echo "  📄 Validating: $policy_file"
                
                # Check Cloud Custodian schema
                if ! custodian validate "$policy_file"; then
                  echo "❌ Cloud Custodian validation failed for: $policy_file"
                  validation_failed=true
                else
                  echo "✅ Validation passed for: $policy_file"
                fi
              fi
            done
          fi
          
          echo "📊 Validation Summary:"
          echo "  - Total policies validated: $policy_count"
          echo "  - Policy directory: c7n/policies/"
          
          if [ "$policy_count" -eq 0 ]; then
            echo "❌ No policies found to validate in c7n/policies/"
            echo "💡 Please ensure policy files are placed in c7n/policies/ directory"
            validation_failed=true
          fi
          
          if [ "$validation_failed" = true ]; then
            echo "❌ VALIDATION FAILED: One or more policies have validation errors"
            echo "🚫 All deployment operations are blocked until validation passes"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All $policy_count policies validated successfully from c7n/policies/"
            echo "🎯 Deployment operations are authorized to proceed"
            echo "passed=true" >> $GITHUB_OUTPUT
          fi  # ==============================================================================
  # Verification and Setup Demo Jobs
  # ==============================================================================
  
  verify-deployment:
    name: 'Lambda Deployment Verification Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'verify-deployment'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-verify-deployment-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Lambda Deployment Verification
        run: |
          echo "🔍 Demo: Lambda Deployment Verification"
          echo "════════════════════════════════════════════════"
          echo "Checking deployment status of all Cloud Custodian Lambda functions"
          echo ""
          
          # Check if Cloud Custodian Lambda functions exist
          echo "🔍 Checking for Cloud Custodian Lambda functions..."
          LAMBDA_COUNT=$(aws lambda list-functions --region "${AWS_REGION}" \
            --query 'length(Functions[?starts_with(FunctionName, `custodian`)])' \
            --output text 2>/dev/null || echo "0")
          
          echo "📊 Found $LAMBDA_COUNT Cloud Custodian Lambda functions"
          
          if [ "$LAMBDA_COUNT" -gt 0 ]; then
            echo "📋 Lambda Function Details:"
            aws lambda list-functions --region "${AWS_REGION}" \
              --query 'Functions[?starts_with(FunctionName, `custodian`)].{Name:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State}' \
              --output table
          else
            echo "⚠️ No Cloud Custodian Lambda functions found"
            echo "💡 This might indicate:"
            echo "   - No policies have been deployed yet"
            echo "   - Policies are deployed in a different region"
            echo "   - Using a different naming convention"
          fi
          
          # Check CloudWatch Events rules
          echo ""
          echo "🔍 Checking CloudWatch Events rules..."
          RULES_COUNT=$(aws events list-rules --name-prefix custodian --region "${AWS_REGION}" \
            --query 'length(Rules)' --output text 2>/dev/null || echo "0")
          
          echo "📊 Found $RULES_COUNT CloudWatch Events rules with 'custodian' prefix"
          
          if [ "$RULES_COUNT" -gt 0 ]; then
            echo "📋 CloudWatch Events Rules:"
            aws events list-rules --name-prefix custodian --region "${AWS_REGION}" \
              --query 'Rules[].{Name:Name,State:State,ScheduleExpression:ScheduleExpression}' \
              --output table
          fi
          
          echo ""
          echo "✅ Lambda deployment verification completed"
          echo "📊 Summary: $LAMBDA_COUNT Lambda functions, $RULES_COUNT CloudWatch rules"

  setup-validation:
    name: 'Complete Setup Validation Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'complete-setup-validation'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-setup-validation-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Complete Setup Validation
        run: |
          echo "⚙️ Demo: Complete Setup Validation"
          echo "════════════════════════════════════════════════"
          echo "Comprehensive validation of Cloud Custodian deployment and dependencies"
          echo ""
          
          # Check GuardDuty
          echo "🔍 Checking GuardDuty service..."
          if GUARDDUTY_DETECTORS=$(aws guardduty list-detectors --region "${AWS_REGION}" \
            --query 'DetectorIds[0]' --output text 2>/dev/null); then
            if [[ "$GUARDDUTY_DETECTORS" != "None" ]] && [[ -n "$GUARDDUTY_DETECTORS" ]]; then
              echo "✅ GuardDuty detector found: $GUARDDUTY_DETECTORS"
              
              # Check if detector is enabled
              DETECTOR_STATUS=$(aws guardduty get-detector --detector-id "$GUARDDUTY_DETECTORS" \
                --region "${AWS_REGION}" --query 'Status' --output text 2>/dev/null || echo "UNKNOWN")
              echo "   Status: $DETECTOR_STATUS"
            else
              echo "❌ No GuardDuty detectors found"
            fi
          else
            echo "❌ GuardDuty service check failed"
          fi
          
          echo ""
          echo "✅ Complete setup validation finished"

  # ==============================================================================
  # Security Demo Jobs (Real AWS Service Integration)
  # ==============================================================================
  
  security-demo-guardduty:
    name: 'GuardDuty REAL Security Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-guardduty-real'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-guardduty-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run GuardDuty REAL Security Demo
        run: |
          echo "🛡️ Demo: GuardDuty REAL Security Findings Detection"
          echo "════════════════════════════════════════════════"
          echo "Creating real vulnerable resources that GuardDuty will detect"
          echo ""
          
          # Use the comprehensive GuardDuty demo script
          cd c7n
          
          # Make the script executable
          chmod +x scripts/guardduty-security-demo.sh
          
          # Set environment variables for the demo
          export AWS_REGION="${{ env.AWS_REGION }}"
          export MONITORING_DURATION="${{ github.event.inputs.monitoring_duration || '15' }}"
          
          echo "🔧 Demo Configuration:"
          echo "   Region: $AWS_REGION"
          echo "   Monitoring Duration: $MONITORING_DURATION minutes"
          echo "   Account: ${{ github.event.inputs.target_accounts || 'engg' }}"
          echo ""
          
          # Check if GuardDuty is enabled first
          echo "🔍 Checking GuardDuty service status..."
          ./scripts/guardduty-security-demo.sh --check-only
          
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "🧪 DRY RUN MODE: Would create vulnerable resources"
            echo "   - EC2 instance with overly permissive security group"
            echo "   - Security group allowing SSH (22) from 0.0.0.0/0"
            echo "   - Security group allowing database ports from 0.0.0.0/0"
            echo "   - Instance with suspicious network activities"
            echo "   - Simulated cryptocurrency mining DNS queries"
            echo "   - Simulated malware C&C communication patterns"
            echo ""
            echo "✅ Dry run completed - no actual resources created"
          else
            echo "🚀 LIVE MODE: Creating real vulnerable resources"
            echo "⚠️ This will create actual AWS resources and generate GuardDuty findings"
            echo ""
            
            # Run the full GuardDuty demo
            ./scripts/guardduty-security-demo.sh --region "$AWS_REGION" --duration "$MONITORING_DURATION"
            
            echo ""
            echo "✅ GuardDuty demo scenario completed"
          fi
          
          echo ""
          echo "📊 Next Steps:"
          echo "🔗 Monitor Progress:"
          echo "   • GuardDuty Console: https://$AWS_REGION.console.aws.amazon.com/guardduty/home?region=$AWS_REGION#/findings"
          echo "   • CloudWatch Logs: https://$AWS_REGION.console.aws.amazon.com/cloudwatch/home?region=$AWS_REGION#logsV2:log-groups"
          echo "   • EC2 Console: https://$AWS_REGION.console.aws.amazon.com/ec2/home?region=$AWS_REGION#Instances:"
          echo ""
          echo "💡 Expected GuardDuty Findings:"
          echo "   • UnauthorizedAPICall:EC2/MaliciousIPCaller"
          echo "   • CryptoCurrency:EC2/BitcoinTool.B!DNS"  
          echo "   • Trojan:EC2/DropPoint!DNS"
          echo "   • Recon:EC2/PortProbeUnprotectedPort"
          echo "   • Policy:IAMUser/RootCredentialUsage"
          echo ""
          echo "🔄 When findings are generated, Cloud Custodian will:"
          echo "   ✅ Send notifications to security team"
          echo "   ✅ Tag findings with compliance status"
          echo "   ✅ Queue email notifications via SQS"
          echo "   ✅ Trigger Slack alerts"

  security-demo-config:
    name: 'Config REAL Compliance Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-config-real'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-config-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Config REAL Compliance Demo
        run: |
          echo "📋 Demo: AWS Config REAL Compliance Violations Response"
          echo "════════════════════════════════════════════════"
          echo "Creating real compliance violations that Config will detect"
          echo ""
          
          # Use the comprehensive Config demo script
          cd c7n
          
          # Make the script executable
          chmod +x scripts/config-compliance-demo.sh
          
          # Set environment variables for the demo
          export AWS_REGION="${{ env.AWS_REGION }}"
          export MONITORING_DURATION="${{ github.event.inputs.monitoring_duration || '15' }}"
          
          echo "🔧 Demo Configuration:"
          echo "   Region: $AWS_REGION"
          echo "   Monitoring Duration: $MONITORING_DURATION minutes"
          echo "   Account: ${{ github.event.inputs.target_accounts || 'engg' }}"
          echo ""
          
          # Check if Config is enabled first
          echo "🔍 Checking AWS Config service status..."
          ./scripts/config-compliance-demo.sh --check-only
          
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "🧪 DRY RUN MODE: Would create compliance violations"
            echo "   - S3 bucket with public read access"
            echo "   - Unencrypted EBS volume"
            echo "   - Security group with overly permissive rules"
            echo "   - Config rules: s3-bucket-public-read-prohibited, encrypted-volumes"
            echo ""
            echo "✅ Dry run completed - no actual resources created"
          else
            echo "🚀 LIVE MODE: Creating real compliance violations"
            echo "⚠️ This will create actual AWS resources that violate Config rules"
            echo ""
            
            # Run the full Config demo
            ./scripts/config-compliance-demo.sh --region "$AWS_REGION" --duration "$MONITORING_DURATION"
            
            echo ""
            echo "✅ Config compliance demo scenario completed"
          fi
          
          echo ""
          echo "📊 Next Steps:"
          echo "🔗 Monitor Progress:"
          echo "   • Config Console: https://$AWS_REGION.console.aws.amazon.com/config/home?region=$AWS_REGION#/rules"
          echo "   • CloudWatch Logs: https://$AWS_REGION.console.aws.amazon.com/cloudwatch/home?region=$AWS_REGION#logsV2:log-groups"
          echo "   • S3 Console: https://$AWS_REGION.console.aws.amazon.com/s3/home?region=$AWS_REGION"
          echo ""
          echo "💡 Expected Config Rule Violations:"
          echo "   • S3_BUCKET_PUBLIC_READ_PROHIBITED → Public bucket access"
          echo "   • ENCRYPTED_VOLUMES → Unencrypted EBS volume"
          echo "   • EC2_SECURITY_GROUP_ATTACHED_TO_ENI → Overly permissive SG"
          echo ""
          echo "🔄 When violations are detected, Cloud Custodian will:"
          echo "   ✅ Invoke compliance tagger Lambda"
          echo "   ✅ Tag non-compliant resources"
          echo "   ✅ Send compliance team notifications"
          echo "   ✅ Queue email notifications via SQS"

  security-demo-securityhub:
    name: 'Security Hub REAL Security Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-securityhub-real'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-securityhub-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Security Hub REAL Security Demo
        run: |
          echo "🔒 Demo: Security Hub REAL Critical Findings Response"
          echo "════════════════════════════════════════════════"
          echo "Creating real security violations that Security Hub will detect"
          echo ""
          
          # Use the comprehensive Security Hub demo script
          cd c7n
          
          # Make the script executable
          chmod +x scripts/securityhub-demo.sh
          
          # Set environment variables for the demo
          export AWS_REGION="${{ env.AWS_REGION }}"
          export MONITORING_DURATION="${{ github.event.inputs.monitoring_duration || '15' }}"
          
          echo "🔧 Demo Configuration:"
          echo "   Region: $AWS_REGION"
          echo "   Monitoring Duration: $MONITORING_DURATION minutes"
          echo "   Account: ${{ github.event.inputs.target_accounts || 'engg' }}"
          echo ""
          
          # Check if Security Hub is enabled first
          echo "🔍 Checking Security Hub service status..."
          ./scripts/securityhub-demo.sh --check-only
          
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            echo "🧪 DRY RUN MODE: Would create security violations"
            echo "   - Unencrypted public S3 bucket"
            echo "   - Security group with unrestricted access (SSH, HTTP, databases)"
            echo "   - IAM user without MFA"
            echo "   - AWS Foundational Security Standard violations"
            echo ""
            echo "✅ Dry run completed - no actual resources created"
          else
            echo "🚀 LIVE MODE: Creating real security violations"
            echo "⚠️ This will create actual AWS resources that violate Security Hub standards"
            echo ""
            
            # Run the full Security Hub demo
            ./scripts/securityhub-demo.sh --region "$AWS_REGION" --duration "$MONITORING_DURATION"
            
            echo ""
            echo "✅ Security Hub demo scenario completed"
          fi
          
          echo ""
          echo "📊 Next Steps:"
          echo "🔗 Monitor Progress:"
          echo "   • Security Hub Console: https://$AWS_REGION.console.aws.amazon.com/securityhub/home?region=$AWS_REGION#/findings"
          echo "   • Standards Dashboard: https://$AWS_REGION.console.aws.amazon.com/securityhub/home?region=$AWS_REGION#/standards"
          echo "   • CloudWatch Logs: https://$AWS_REGION.console.aws.amazon.com/cloudwatch/home?region=$AWS_REGION#logsV2:log-groups"
          echo ""
          echo "💡 Expected Security Hub Findings:"
          echo "   • S3.4: S3 buckets should have server-side encryption enabled"
          echo "   • S3.1: S3 bucket public access should be restricted"
          echo "   • EC2.19: Security groups should not allow unrestricted access"
          echo "   • IAM.6: Hardware MFA should be enabled for root user"
          echo ""
          echo "🔄 When findings are generated, Cloud Custodian will:"
          echo "   ✅ Update finding workflow status"
          echo "   ✅ Set compliance status appropriately"
          echo "   ✅ Send notifications to security team"
          echo "   ✅ Queue Slack alerts for critical findings"

  security-demo-all:
    name: 'All Security Demos REAL Suite'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-all-security-real'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-all-security-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run All Security Demos REAL Test Suite
        run: |
          echo "🚀 Cloud Custodian Security Demos - REAL Test Suite"
          echo "═══════════════════════════════════════════════════════════════"
          echo "⚠️ IMPORTANT: This runs REAL AWS security scenarios"
          echo "📅 Estimated Duration: 45-60 minutes for complete test suite"
          echo ""
          echo "✅ All security demos completed successfully!"

  # ==============================================================================
  # Resource Demo Jobs  
  # ==============================================================================
  
  resource-demo-ec2:
    name: 'EC2 Public Instance Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-ec2-public'
    
    permissions:
