  cleanup-scan:
    name: 'Cleanup Scan (Dry Run Analysis)'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'cleanup-scan'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-cleanup-scan-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer boto3
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Scan for Cloud Custodian Resources
        run: |
          echo "🔍 Cleanup Scan: Analyzing Cloud Custodian Resources"
          echo "════════════════════════════════════════════════════════════"
          echo "Scanning AWS account for Cloud Custodian resources to clean up"
          echo ""
          
          export AWS_REGION="${{ env.AWS_REGION }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          echo "📊 AWS Context:"
          echo "   Account: $ACCOUNT_ID"
          echo "   Region: $AWS_REGION"
          echo "   Scan Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo ""
          
          # Lambda Functions
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Lambda Functions (custodian-*)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          LAMBDA_COUNT=$(aws lambda list-functions --region "$AWS_REGION" \
            --query 'Functions[?starts_with(FunctionName, `custodian`)].FunctionName' \
            --output text 2>/dev/null | wc -w || echo "0")
          echo "📦 Total Lambda Functions: $LAMBDA_COUNT"
          if [[ "$LAMBDA_COUNT" -gt 0 ]]; then
            aws lambda list-functions --region "$AWS_REGION" \
              --query 'Functions[?starts_with(FunctionName, `custodian`)].{Name:FunctionName,Runtime:Runtime,Size:CodeSize,Modified:LastModified}' \
              --output table
          fi
          echo ""
          
          # EventBridge Rules
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📅 EventBridge Rules (custodian-*)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          RULES_COUNT=$(aws events list-rules --region "$AWS_REGION" --name-prefix custodian \
            --query 'Rules[].Name' --output text 2>/dev/null | wc -w || echo "0")
          echo "📋 Total EventBridge Rules: $RULES_COUNT"
          if [[ "$RULES_COUNT" -gt 0 ]]; then
            aws events list-rules --region "$AWS_REGION" --name-prefix custodian \
              --query 'Rules[].{Name:Name,State:State,Schedule:ScheduleExpression}' \
              --output table
          fi
          echo ""
          
          # S3 Buckets
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 S3 Buckets (custodian-*, demo, test)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          BUCKET_LIST=$(aws s3 ls | grep -E "(custodian|demo|test)" || echo "")
          if [[ -n "$BUCKET_LIST" ]]; then
            echo "$BUCKET_LIST" | while read -r created time zone name; do
              SIZE=$(aws s3 ls s3://$name --recursive --summarize 2>/dev/null | grep "Total Size" | awk '{print $3}')
              echo "  📦 $name (Size: ${SIZE:-0} bytes)"
            done
          else
            echo "  ✅ No matching S3 buckets found"
          fi
          echo ""
          
          # EC2 Instances
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🖥️ EC2 Instances (demo/test tagged)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          EC2_COUNT=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:TestResource,Values=true" \
            --query 'Reservations[].Instances[?State.Name!=`terminated`].InstanceId' \
            --output text 2>/dev/null | wc -w || echo "0")
          echo "🖥️ Total Demo EC2 Instances: $EC2_COUNT"
          if [[ "$EC2_COUNT" -gt 0 ]]; then
            aws ec2 describe-instances --region "$AWS_REGION" \
              --filters "Name=tag:TestResource,Values=true" \
              --query 'Reservations[].Instances[?State.Name!=`terminated`].{ID:InstanceId,Type:InstanceType,State:State.Name,Name:Tags[?Key==`Name`].Value|[0]}' \
              --output table
          fi
          echo ""
          
          # Security Groups
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔒 Security Groups (demo/test)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          SG_COUNT=$(aws ec2 describe-security-groups --region "$AWS_REGION" \
            --filters "Name=group-name,Values=*demo*,*test*,*custodian*" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' \
            --output text 2>/dev/null | wc -w || echo "0")
          echo "🔒 Total Demo Security Groups: $SG_COUNT"
          echo ""
          
          # IAM Users
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "👤 IAM Test Users"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          IAM_USER_COUNT=$(aws iam list-users \
            --query 'Users[?starts_with(UserName, `custodian-test`)].UserName' \
            --output text 2>/dev/null | wc -w || echo "0")
          echo "👤 Total Test IAM Users: $IAM_USER_COUNT"
          echo ""
          
          # CloudWatch Log Groups
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 CloudWatch Log Groups (/aws/lambda/custodian-*)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          LOG_GROUP_COUNT=$(aws logs describe-log-groups --region "$AWS_REGION" \
            --log-group-name-prefix '/aws/lambda/custodian-' \
            --query 'logGroups[].logGroupName' \
            --output text 2>/dev/null | wc -w || echo "0")
          echo "📊 Total CloudWatch Log Groups: $LOG_GROUP_COUNT"
          if [[ "$LOG_GROUP_COUNT" -gt 0 ]]; then
            aws logs describe-log-groups --region "$AWS_REGION" \
              --log-group-name-prefix '/aws/lambda/custodian-' \
              --query 'logGroups[].{Name:logGroupName,Size:storedBytes,RetentionDays:retentionInDays}' \
              --output table
          fi
          echo ""
          
          # Summary
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 CLEANUP SCAN SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Resource Count Summary:"
          echo "  🔹 Lambda Functions: $LAMBDA_COUNT"
          echo "  🔹 EventBridge Rules: $RULES_COUNT"
          echo "  🔹 EC2 Instances: $EC2_COUNT"
          echo "  🔹 Security Groups: $SG_COUNT"
          echo "  🔹 IAM Test Users: $IAM_USER_COUNT"
          echo "  🔹 CloudWatch Log Groups: $LOG_GROUP_COUNT"
          echo ""
          
          # Ensure all counts are valid integers (wc -w should already return clean numbers)
          LAMBDA_COUNT=${LAMBDA_COUNT:-0}
          RULES_COUNT=${RULES_COUNT:-0}
          EC2_COUNT=${EC2_COUNT:-0}
          SG_COUNT=${SG_COUNT:-0}
          IAM_USER_COUNT=${IAM_USER_COUNT:-0}
          LOG_GROUP_COUNT=${LOG_GROUP_COUNT:-0}
          
          TOTAL_RESOURCES=$((LAMBDA_COUNT + RULES_COUNT + EC2_COUNT + SG_COUNT + IAM_USER_COUNT + LOG_GROUP_COUNT))
          
          if [[ "$TOTAL_RESOURCES" -eq 0 ]]; then
            echo "✅ No Cloud Custodian resources found to clean up"
            echo "   Your AWS account is clean!"
          else
            echo "⚠️  Total Resources Found: $TOTAL_RESOURCES"
            echo ""
            echo "💡 Recommended Actions:"
            echo "   1. Review the resources listed above"
            echo "   2. Run 'cleanup-comprehensive' to remove all resources"
            echo "   3. Or run specific cleanup jobs:"
            echo "      • cleanup-demo-resources: Remove demo EC2/RDS/EBS resources"
            echo "      • cleanup-security-tests: Remove security test resources"
            echo "      • cleanup-comprehensive: Remove ALL Cloud Custodian resources"
          fi
          echo ""
          echo "✅ Cleanup scan completed"
      
      - name: Generate Scan Report
        if: always()
        run: |
          echo "# 🔍 Cloud Custodian Resource Scan Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Account**: $(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Resource Summary" >> $GITHUB_STEP_SUMMARY
          echo "This scan identified Cloud Custodian resources that can be cleaned up." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Use the workflow dispatch options to clean up specific resource types:" >> $GITHUB_STEP_SUMMARY
          echo "- **cleanup-demo-resources**: EC2/RDS/EBS demo resources" >> $GITHUB_STEP_SUMMARY
          echo "- **cleanup-security-tests**: Security Hub/GuardDuty/Config test resources" >> $GITHUB_STEP_SUMMARY
          echo "- **cleanup-comprehensive**: ALL Cloud Custodian resources" >> $GITHUB_STEP_SUMMARY

  cleanup-except-s3:
    name: 'Cleanup All Resources Except S3 Buckets'
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.operation_type == 'cleanup-except-s3'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-cleanup-except-s3-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer boto3
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Cleanup All Resources Except S3
        run: |
          set +e  # Continue on errors
          
          echo "🧹 Cleanup: Removing all Cloud Custodian resources EXCEPT S3 buckets"
          echo "════════════════════════════════════════════════════════════════════"
          echo "⚠️  This will remove Lambda functions, EventBridge rules, CloudWatch logs,"
          echo "   EC2 instances, Security Groups, IAM resources, and other demo resources"
          echo "   but will PRESERVE all S3 buckets"
          echo ""
          
          export AWS_REGION="${{ env.AWS_REGION }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          echo "📊 AWS Context:"
          echo "   Account: $ACCOUNT_ID"
          echo "   Region: $AWS_REGION"
          echo "   Time: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          echo ""
          
          # Track cleanup results
          DELETED_COUNT=0
          FAILED_COUNT=0
          HAS_ERRORS=0
          
          # Phase 1: Delete Lambda Functions
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Phase 1: Cleaning up Lambda Functions"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          LAMBDA_FUNCTIONS=$(aws lambda list-functions --region "$AWS_REGION" \
            --query 'Functions[?starts_with(FunctionName, `custodian`)].FunctionName' \
            --output text 2>/dev/null)
          
          if [[ -n "$LAMBDA_FUNCTIONS" ]]; then
            for FUNC in $LAMBDA_FUNCTIONS; do
              echo "🗑️  Deleting Lambda function: $FUNC"
              if aws lambda delete-function --region "$AWS_REGION" --function-name "$FUNC" 2>/dev/null; then
                echo "   ✅ Deleted: $FUNC"
                ((DELETED_COUNT++))
              else
                echo "   ❌ Failed to delete: $FUNC"
                ((FAILED_COUNT++))
              fi
            done
          else
            echo "✅ No Lambda functions found"
          fi
          echo ""
          
          # Phase 2: Delete EventBridge Rules
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Phase 2: Cleaning up EventBridge Rules"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          EVENT_RULES=$(aws events list-rules --region "$AWS_REGION" --name-prefix custodian \
            --query 'Rules[].Name' --output text 2>/dev/null || echo "")
          
          if [[ -n "$EVENT_RULES" ]]; then
            for RULE in $EVENT_RULES; do
              echo "🗑️  Processing rule: $RULE"
              
              # Remove targets first
              TARGETS=$(aws events list-targets-by-rule --region "$AWS_REGION" --rule "$RULE" \
                --query 'Targets[].Id' --output text 2>/dev/null || echo "")
              
              if [[ -n "$TARGETS" ]]; then
                echo "   📎 Removing targets from rule: $RULE"
                aws events remove-targets --region "$AWS_REGION" --rule "$RULE" --ids $TARGETS 2>&1 || echo "   ⚠️  Warning: Could not remove some targets"
              fi
              
              # Delete the rule
              if aws events delete-rule --region "$AWS_REGION" --name "$RULE" 2>&1; then
                echo "   ✅ Deleted rule: $RULE"
                ((DELETED_COUNT++))
              else
                echo "   ❌ Failed to delete rule: $RULE"
                ((FAILED_COUNT++))
              fi
            done
          else
            echo "✅ No EventBridge rules found"
          fi
          echo ""
          
          # Phase 3: Delete CloudWatch Log Groups
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Phase 3: Cleaning up CloudWatch Log Groups"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          LOG_GROUPS=$(aws logs describe-log-groups --region "$AWS_REGION" \
            --log-group-name-prefix '/aws/lambda/custodian-' \
            --query 'logGroups[].logGroupName' --output text 2>/dev/null || echo "")
          
          if [[ -n "$LOG_GROUPS" ]]; then
            for LOG_GROUP in $LOG_GROUPS; do
              echo "🗑️  Deleting log group: $LOG_GROUP"
              if aws logs delete-log-group --region "$AWS_REGION" --log-group-name "$LOG_GROUP" 2>&1; then
                echo "   ✅ Deleted: $LOG_GROUP"
                ((DELETED_COUNT++))
              else
                echo "   ❌ Failed to delete: $LOG_GROUP"
                ((FAILED_COUNT++))
              fi
            done
          else
            echo "✅ No CloudWatch log groups found"
          fi
          echo ""
          
          # Phase 4: Delete EC2 Instances (Demo/Test)
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Phase 4: Cleaning up EC2 Instances"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          EC2_INSTANCES=$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:TestResource,Values=true" "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null || echo "")
          
          if [[ -n "$EC2_INSTANCES" ]]; then
            echo "🗑️  Terminating EC2 instances: $EC2_INSTANCES"
            if aws ec2 terminate-instances --region "$AWS_REGION" --instance-ids $EC2_INSTANCES 2>&1; then
              echo "   ✅ Terminated instances"
              for INSTANCE in $EC2_INSTANCES; do
                ((DELETED_COUNT++))
              done
            else
              echo "   ❌ Failed to terminate instances"
              ((FAILED_COUNT++))
            fi
          else
            echo "✅ No EC2 instances found"
          fi
          echo ""
          
          # Phase 5: Delete Security Groups
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Phase 5: Cleaning up Security Groups"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏳ Waiting 30 seconds for EC2 instances to terminate..."
          sleep 30
          
          SECURITY_GROUPS=$(aws ec2 describe-security-groups --region "$AWS_REGION" \
            --filters "Name=group-name,Values=*demo*,*test*,*custodian*" \
            --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text 2>/dev/null || echo "")
          
          if [[ -n "$SECURITY_GROUPS" ]]; then
            for SG in $SECURITY_GROUPS; do
              echo "🗑️  Deleting security group: $SG"
              if aws ec2 delete-security-group --region "$AWS_REGION" --group-id "$SG" 2>&1; then
                echo "   ✅ Deleted: $SG"
                ((DELETED_COUNT++))
              else
                echo "   ⚠️  Skipped (may be in use): $SG"
              fi
            done
          else
            echo "✅ No security groups found"
          fi
          echo ""
          
          # Phase 6: Delete IAM Test Users
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Phase 6: Cleaning up IAM Test Users"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          IAM_USERS=$(aws iam list-users \
            --query 'Users[?starts_with(UserName, `custodian-test`)].UserName' \
            --output text 2>/dev/null || echo "")
          
          if [[ -n "$IAM_USERS" ]]; then
            for USER in $IAM_USERS; do
              echo "🗑️  Deleting IAM user: $USER"
              
              # Delete access keys
              ACCESS_KEYS=$(aws iam list-access-keys --user-name "$USER" \
                --query 'AccessKeyMetadata[].AccessKeyId' --output text 2>/dev/null || echo "")
              for KEY in $ACCESS_KEYS; do
                aws iam delete-access-key --user-name "$USER" --access-key-id "$KEY" 2>&1 || true
              done
              
              # Delete user
              if aws iam delete-user --user-name "$USER" 2>&1; then
                echo "   ✅ Deleted: $USER"
                ((DELETED_COUNT++))
              else
                echo "   ❌ Failed to delete: $USER"
                ((FAILED_COUNT++))
              fi
            done
          else
            echo "✅ No IAM test users found"
          fi
          echo ""
          
          # Summary
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 CLEANUP SUMMARY (Excluding S3)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Resources Deleted: $DELETED_COUNT"
          echo "❌ Resources Failed: $FAILED_COUNT"
          echo "📦 S3 Buckets: PRESERVED (not deleted)"
          echo ""
          
          if [[ $FAILED_COUNT -gt 0 ]]; then
            echo "⚠️  Cleanup completed with some failures (S3 buckets preserved)"
            HAS_ERRORS=1
          else
            echo "✅ Cleanup completed successfully (S3 buckets preserved)"
          fi
          
          # Exit with proper code
          exit $HAS_ERRORS
      
      - name: Generate Cleanup Report
        if: always()
        run: |
          echo "# 🧹 Cleanup Report (Except S3 Buckets)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cleanup Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "**Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "**Account**: $(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "All Cloud Custodian resources have been cleaned up except S3 buckets." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Removed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Lambda Functions" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ EventBridge Rules" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ CloudWatch Log Groups" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ EC2 Instances (demo/test)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security Groups (demo/test)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ IAM Test Users" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resources Preserved:" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 S3 Buckets (all preserved)" >> $GITHUB_STEP_SUMMARY

  # ==============================================================================
  # Policy Deployment Jobs
  # ==============================================================================

  deploy:
    name: 'Deploy Cloud Custodian Policies'
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.operation_type != 'validate' &&
      contains(github.event.inputs.operation_type, 'deploy') &&
      needs.validate.outputs.validation-passed == 'true'
    
    permissions:
      id-token: write
      contents: read
    
    outputs:
      deployment-status: ${{ steps.deployment.outputs.status }}
      deployed-policies: ${{ steps.deployment.outputs.policies }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-c7n-Deploy-${{ github.run_number }}
      
      - name: Install Cloud Custodian and Dependencies
        run: |
          echo "📦 Installing Cloud Custodian ecosystem..."
          pip install --upgrade pip
          
          # Install core Cloud Custodian packages
          pip install 'c7n>=0.9.40'
          pip install c7n-org
          
          # Install mailer dependencies if needed
          if [[ "${{ github.event.inputs.operation_type }}" == "deploy-mailer" ]]; then
            echo "📧 Installing mailer dependencies..."
            pip install --upgrade pip setuptools wheel
            
            # Use specific versions to avoid conflicts
            pip install --force-reinstall PyJWT==2.8.0
            pip install --force-reinstall cryptography==44.0.0
            pip install --force-reinstall requests==2.32.4
            pip install --force-reinstall decorator>=4.4.0
            pip install --force-reinstall boto3>=1.26.0
            pip install --force-reinstall botocore>=1.29.0
            pip install --force-reinstall jsonschema>=3.0.0
            pip install --force-reinstall python-dateutil>=2.8.0
            pip install --force-reinstall pyyaml>=5.4.0
            pip install --force-reinstall tabulate>=0.8.0
            pip install --force-reinstall c7n-mailer>=0.6.20
            
            echo "🔍 Verifying PyJWT installation..."
            python -c "import jwt; print(f'✅ PyJWT {jwt.__version__} installed successfully')"
          fi
          
          # Install additional requirements if present
          if [ -f "c7n/requirements.txt" ]; then
            pip install -r c7n/requirements.txt
            echo "✅ Installed additional requirements"
          fi
          
          # Install system dependencies
          sudo apt-get update && sudo apt-get install -y jq
          
          echo "✅ Installation complete"
          custodian version
      
      - name: Fix Line Endings and Make Scripts Executable
        run: |
          echo "🔧 Converting line endings from CRLF to LF..."
          # Install dos2unix if not available
          sudo apt-get update && sudo apt-get install -y dos2unix
          
          # Convert all shell scripts to Unix line endings
          find c7n/scripts -name "*.sh" -type f -exec dos2unix {} \;
          
          echo "🔧 Making c7n scripts executable..."
          chmod +x c7n/scripts/*.sh
          
          echo "✅ Scripts are now executable with correct line endings"
      
      - name: Set Deployment Environment Variables
        run: |
          echo "🔧 Setting deployment environment variables..."
          
          # Set target accounts based on input
          TARGET_ACCOUNTS="${{ github.event.inputs.target_accounts }}"
          if [[ -z "$TARGET_ACCOUNTS" || "$TARGET_ACCOUNTS" == "" ]]; then
            TARGET_ACCOUNTS="engg"
          fi
          echo "TARGET_ACCOUNTS=$TARGET_ACCOUNTS" >> $GITHUB_ENV
          
          # Set regions
          REGIONS="${{ github.event.inputs.regions }}"
          if [[ -z "$REGIONS" || "$REGIONS" == "" ]]; then
            REGIONS="us-east-1"
          fi
          echo "REGIONS=$REGIONS" >> $GITHUB_ENV
          
          # Set dry-run mode
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          echo "DRY_RUN=$DRY_RUN" >> $GITHUB_ENV
          
          echo "✅ Environment variables set:"
          echo "  - Target Accounts: $TARGET_ACCOUNTS"
          echo "  - Regions: $REGIONS"
          echo "  - Dry Run: $DRY_RUN"
      
      - name: Deploy Policies
        id: deployment
        run: |
          echo "🚀 Deploying Cloud Custodian Policies"
          echo "════════════════════════════════════════════════════════"
          echo "Operation: ${{ github.event.inputs.operation_type }}"
          echo "Target Accounts: $TARGET_ACCOUNTS"
          echo "Regions: $REGIONS"
          echo "Dry Run: $DRY_RUN"
          echo ""
          
          cd c7n
          deployment_failed=false
          deployed_policies=""
          
          # Create output directory
          mkdir -p output logs
          
          case "${{ github.event.inputs.operation_type }}" in
            "deploy-all")
              echo "🎯 Running deploy-all operation..."
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "🔍 Running in dry-run mode..."
                export DRY_RUN=true
              fi
              
              echo "📋 Executing: ./scripts/deploy-policies.sh"
              if ./scripts/deploy-policies.sh; then
                echo "✅ Deploy-all completed successfully"
                deployed_policies=$(find policies/ -name "*.yml" -exec basename {} .yml \; | tr '\n' ',' | sed 's/,$//')
              else
                echo "❌ Deploy-all failed"
                deployment_failed=true
              fi
              ;;
              
            "deploy-updated")
              echo "🔄 Running deploy-updated operation..."
              if [[ "$DRY_RUN" == "true" ]]; then
                echo "🔍 Running in dry-run mode..."
                export DRY_RUN=true
              fi
              
              echo "📋 Executing: ./scripts/deploy-updated-policies.sh"
              if ./scripts/deploy-updated-policies.sh; then
                echo "✅ Deploy-updated completed successfully"
                # Try to detect which policies were updated
                deployed_policies=$(git diff --name-only HEAD~1 HEAD -- policies/ | xargs -I {} basename {} .yml | tr '\n' ',' | sed 's/,$//' || echo "updated-policies")
              else
                echo "❌ Deploy-updated failed"
                deployment_failed=true
              fi
              ;;
              
            "deploy-mailer")
              echo "📧 Running deploy-mailer operation..."
              
              # Apply PyJWT fix if needed
              echo "🔧 Applying PyJWT packaging fix..."
              if [[ -f "scripts/fix-core-deps.py" ]]; then
                python scripts/fix-core-deps.py || echo "Fix script not needed or already applied"
              fi
              
              echo "📋 Executing: ./scripts/deploy-mailer.sh"
              if ./scripts/deploy-mailer.sh; then
                echo "✅ Deploy-mailer completed successfully"
                deployed_policies="mailer-service"
              else
                echo "❌ Deploy-mailer failed"
                deployment_failed=true
              fi
              ;;
              
            "cleanup")
              echo "🧹 Running cleanup operation..."
              echo "📋 Executing: ./scripts/clean-removed-policies.sh"
              if ./scripts/clean-removed-policies.sh; then
                echo "✅ Cleanup completed successfully"
                deployed_policies="cleanup-completed"
              else
                echo "❌ Cleanup failed"
                deployment_failed=true
              fi
              ;;
              
            *)
              echo "❌ Unknown operation type: ${{ github.event.inputs.operation_type }}"
              deployment_failed=true
              ;;
          esac
          
          echo ""
          echo "📊 Deployment Summary:"
          echo "════════════════════════════════════════════════════════"
          echo "Operation: ${{ github.event.inputs.operation_type }}"
          echo "Status: $([ "$deployment_failed" = true ] && echo "❌ FAILED" || echo "✅ SUCCESS")"
          echo "Deployed Policies: $deployed_policies"
          echo "Dry Run Mode: $DRY_RUN"
          echo ""
          
          # Set outputs
          echo "policies=$deployed_policies" >> $GITHUB_OUTPUT
          
          if [[ "$deployment_failed" == true ]]; then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ DEPLOYMENT FAILED"
            echo "🔍 Check logs and artifacts for detailed error information"
            exit 1
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "🎯 All operations completed without errors"
          fi
      
      - name: Upload Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-output-${{ github.run_number }}
          path: |
            c7n/output/
            c7n/logs/
          retention-days: 30
      
      - name: Generate Deployment Report
        if: always()
        run: |
          echo "📊 Cloud Custodian Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "====================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Operation**: ${{ github.event.inputs.operation_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ steps.deployment.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Accounts**: $TARGET_ACCOUNTS" >> $GITHUB_STEP_SUMMARY
          echo "**Regions**: $REGIONS" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run**: $DRY_RUN" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed Policies**: ${{ steps.deployment.outputs.policies }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 🛠️ Deployment Scripts Used" >> $GITHUB_STEP_SUMMARY
          case "${{ github.event.inputs.operation_type }}" in
            "deploy-all")
              echo "- **Script**: \`c7n/scripts/deploy-policies.sh\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Purpose**: Deploy all Cloud Custodian policies" >> $GITHUB_STEP_SUMMARY
              ;;
            "deploy-updated")
              echo "- **Script**: \`c7n/scripts/deploy-updated-policies.sh\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Purpose**: Deploy only changed/updated policies" >> $GITHUB_STEP_SUMMARY
              ;;
            "deploy-mailer")
              echo "- **Script**: \`c7n/scripts/deploy-mailer.sh\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Purpose**: Deploy notification mailer service" >> $GITHUB_STEP_SUMMARY
              ;;
            "cleanup")
              echo "- **Script**: \`c7n/scripts/clean-removed-policies.sh\`" >> $GITHUB_STEP_SUMMARY
              echo "- **Purpose**: Clean up removed policy resources" >> $GITHUB_STEP_SUMMARY
              ;;
          esac
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📁 Resources" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy Files**: \`c7n/policies/*.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Scripts**: \`c7n/scripts/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration**: \`c7n/config/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts**: Available in workflow artifacts" >> $GITHUB_STEP_SUMMARY

  validate-deployed-lambdas:
    name: 'Validate Deployed Lambda Functions'
    runs-on: ubuntu-latest
    needs: [deploy]
    if: |
      github.event_name == 'workflow_dispatch' && 
      contains(github.event.inputs.operation_type, 'deploy') &&
      needs.deploy.result == 'success'
    
    permissions:
      id-token: write
      contents: read
    
    outputs:
      lambda-validation-passed: ${{ steps.lambda-validation.outputs.passed }}
      lambda-count: ${{ steps.lambda-validation.outputs.lambda-count }}
      active-lambdas: ${{ steps.lambda-validation.outputs.active-lambdas }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-lambda-validation-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Validate Deployed Lambda Functions
        id: lambda-validation
        run: |
          echo "🔍 Validating Cloud Custodian Lambda Functions in AWS"
          echo "════════════════════════════════════════════════════════"
          echo "Checking deployed Lambda functions and their configurations..."
          echo ""
          
          # Set target regions based on input
          REGIONS="${{ github.event.inputs.regions }}"
          if [[ -z "$REGIONS" || "$REGIONS" == "" ]]; then
            REGIONS="us-east-1"
          fi
          echo "🌍 Target regions: $REGIONS"
          
          # Convert comma-separated regions to array
          IFS=',' read -ra REGION_ARRAY <<< "$REGIONS"
          
          total_lambdas=0
          total_active=0
          total_errors=0
          all_lambda_details=""
          validation_failed=false
          
          for region in "${REGION_ARRAY[@]}"; do
            region=$(echo "$region" | xargs)  # Trim whitespace
            echo ""
            echo "🔍 Checking region: $region"
            echo "─────────────────────────────────"
            
            # Get all Cloud Custodian Lambda functions
            echo "📋 Searching for Cloud Custodian Lambda functions..."
            LAMBDA_FUNCTIONS=$(aws lambda list-functions \
              --region "$region" \
              --query 'Functions[?starts_with(FunctionName, `custodian`)].[FunctionName,State,LastModified,Runtime,Timeout,MemorySize]' \
              --output text 2>/dev/null || echo "")
            
            if [[ -z "$LAMBDA_FUNCTIONS" ]]; then
              echo "⚠️ No Cloud Custodian Lambda functions found in region: $region"
              continue
            fi
            
            region_lambda_count=0
            region_active_count=0
            
            # Process each Lambda function
            while IFS=$'\t' read -r func_name state last_modified runtime timeout memory; do
              if [[ -n "$func_name" ]]; then
                region_lambda_count=$((region_lambda_count + 1))
                total_lambdas=$((total_lambdas + 1))
                
                echo ""
                echo "📦 Function: $func_name"
                echo "   📊 State: $state"
                echo "   🕒 Last Modified: $last_modified"
                echo "   ⚙️ Runtime: $runtime"
                echo "   ⏱️ Timeout: ${timeout}s"
                echo "   💾 Memory: ${memory}MB"
                
                # Check if function is active/ready
                if [[ "$state" == "Active" ]]; then
                  region_active_count=$((region_active_count + 1))
                  total_active=$((total_active + 1))
                  echo "   ✅ Status: Active and Ready"
                  
                  # Get additional function details
                  func_details=$(aws lambda get-function \
                    --function-name "$func_name" \
                    --region "$region" \
                    --query 'Configuration.[Description,Handler,Environment.Variables]' \
                    --output text 2>/dev/null || echo "")
                  
                  # Check CloudWatch Events rules for this function
                  related_rules=$(aws events list-rule-names-by-target \
                    --targets "Id=1,Arn=arn:aws:lambda:$region:*:function:$func_name" \
                    --region "$region" \
                    --query 'RuleNames' \
                    --output text 2>/dev/null || echo "")
                  
                  if [[ -n "$related_rules" && "$related_rules" != "None" ]]; then
                    echo "   📅 CloudWatch Rules: $related_rules"
                  fi
                  
                  # Test function configuration (basic validation)
                  config_check=$(aws lambda get-function-configuration \
                    --function-name "$func_name" \
                    --region "$region" \
                    --query '[State,StateReason]' \
                    --output text 2>/dev/null || echo "Error")
                  
                  if [[ "$config_check" == *"Error"* ]]; then
                    echo "   ⚠️ Configuration check failed"
                    total_errors=$((total_errors + 1))
                  else
                    echo "   ✅ Configuration: Valid"
                  fi
                  
                elif [[ "$state" == "Pending" ]]; then
                  echo "   🟡 Status: Pending (deployment in progress)"
                elif [[ "$state" == "Failed" ]]; then
                  echo "   ❌ Status: Failed"
                  total_errors=$((total_errors + 1))
                  validation_failed=true
                else
                  echo "   ⚠️ Status: $state (unknown state)"
                fi
                
                # Store function details for summary
                all_lambda_details="${all_lambda_details}${region}:${func_name}:${state};"
              fi
            done <<< "$LAMBDA_FUNCTIONS"
            
            echo ""
            echo "📊 Region Summary ($region):"
            echo "   - Lambda functions found: $region_lambda_count"
            echo "   - Active functions: $region_active_count"
            echo ""
          done
          
          # Check for CloudWatch Events rules
          echo "🔍 Checking CloudWatch Events Rules..."
          echo "─────────────────────────────────────"
          for region in "${REGION_ARRAY[@]}"; do
            region=$(echo "$region" | xargs)
            
            rules_count=$(aws events list-rules \
              --name-prefix custodian \
              --region "$region" \
              --query 'length(Rules)' \
              --output text 2>/dev/null || echo "0")
            
            if [[ "$rules_count" -gt 0 ]]; then
              echo "✅ Found $rules_count CloudWatch Events rules in $region"
              
              # List the rules
              aws events list-rules \
                --name-prefix custodian \
                --region "$region" \
                --query 'Rules[].{Name:Name,State:State,ScheduleExpression:ScheduleExpression}' \
                --output table 2>/dev/null || echo "Error listing rules"
            else
              echo "⚠️ No CloudWatch Events rules found in $region"
            fi
          done
          
          echo ""
          echo "📊 FINAL VALIDATION SUMMARY"
          echo "════════════════════════════════════════════════════════"
          echo "🌍 Regions checked: $(echo "$REGIONS" | tr ',' ' ')"
          echo "📦 Total Lambda functions found: $total_lambdas"
          echo "✅ Active Lambda functions: $total_active"
          echo "❌ Failed/Error functions: $total_errors"
          echo ""
          
          # Set outputs
          echo "lambda-count=$total_lambdas" >> $GITHUB_OUTPUT
          echo "active-lambdas=$total_active" >> $GITHUB_OUTPUT
          
          # Determine validation result
          if [[ "$total_lambdas" -eq 0 ]]; then
            echo "⚠️ VALIDATION WARNING: No Cloud Custodian Lambda functions found"
            echo "💡 This might indicate:"
            echo "   - Policies are not configured for Lambda deployment (mode: periodic/cloudtrail)"
            echo "   - Deployment failed silently"
            echo "   - Functions are deployed with different naming convention"
            echo "   - Wrong region specified"
            echo ""
            echo "🔍 Recommendation: Check deployment logs and ensure policies have appropriate modes"
            echo "passed=warning" >> $GITHUB_OUTPUT
          elif [[ "$validation_failed" == true || "$total_errors" -gt 0 ]]; then
            echo "❌ VALIDATION FAILED: Some Lambda functions have errors"
            echo "🚫 Deployment validation unsuccessful"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          elif [[ "$total_active" -eq "$total_lambdas" && "$total_lambdas" -gt 0 ]]; then
            echo "✅ VALIDATION PASSED: All Lambda functions are active and healthy"
            echo "🎯 Deployment validation successful"
            echo "📈 Success rate: 100% ($total_active/$total_lambdas)"
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ VALIDATION PARTIAL: Some functions may still be deploying"
            echo "📊 Active functions: $total_active/$total_lambdas"
            echo "💡 Some functions might still be in 'Pending' state"
            echo "passed=partial" >> $GITHUB_OUTPUT
          fi
          
          echo ""
          echo "✅ Lambda function validation completed"

  # ==============================================================================
  # Standalone Lambda Validation Job (can be triggered independently)
  # ==============================================================================
  
  validate-lambdas:
    name: 'Validate Lambda Functions (Standalone)'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'validate-lambdas'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-standalone-lambda-validation-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Standalone Lambda Function Validation
        run: |
          echo "🔍 Standalone Cloud Custodian Lambda Function Validation"
          echo "════════════════════════════════════════════════════════════"
          echo "Comprehensive check of all deployed Lambda functions and configurations"
          echo ""
          
          # Set target regions based on input
          REGIONS="${{ github.event.inputs.regions }}"
          if [[ -z "$REGIONS" || "$REGIONS" == "" ]]; then
            REGIONS="us-east-1"
          fi
          echo "🌍 Target regions: $REGIONS"
          
          # Set target accounts based on input
          TARGET_ACCOUNTS="${{ github.event.inputs.target_accounts }}"
          if [[ -z "$TARGET_ACCOUNTS" || "$TARGET_ACCOUNTS" == "" ]]; then
            TARGET_ACCOUNTS="engg"
          fi
          echo "🏢 Target accounts: $TARGET_ACCOUNTS"
          echo ""
          
          # Convert comma-separated regions to array
          IFS=',' read -ra REGION_ARRAY <<< "$REGIONS"
          
          total_lambdas=0
          total_active=0
          total_errors=0
          validation_failed=false
          
          for region in "${REGION_ARRAY[@]}"; do
            region=$(echo "$region" | xargs)  # Trim whitespace
            echo ""
            echo "🔍 Validating region: $region"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            # Get all Cloud Custodian Lambda functions with detailed info
            echo "📋 Discovering Cloud Custodian Lambda functions..."
            LAMBDA_FUNCTIONS=$(aws lambda list-functions \
              --region "$region" \
              --query 'Functions[?starts_with(FunctionName, `custodian`)].[FunctionName,State,LastModified,Runtime,Timeout,MemorySize,CodeSize,Description]' \
              --output text 2>/dev/null || echo "")
            
            if [[ -z "$LAMBDA_FUNCTIONS" ]]; then
              echo "⚠️ No Cloud Custodian Lambda functions found in region: $region"
              echo "💡 Expected function name pattern: custodian-*"
              continue
            fi
            
            region_lambda_count=0
            region_active_count=0
            region_error_count=0
            
            # Process each Lambda function with detailed validation
            while IFS=$'\t' read -r func_name state last_modified runtime timeout memory code_size description; do
              if [[ -n "$func_name" ]]; then
                region_lambda_count=$((region_lambda_count + 1))
                total_lambdas=$((total_lambdas + 1))
                
                echo ""
                echo "📦 Function: $func_name"
                echo "   📊 State: $state"
                echo "   🕒 Last Modified: $last_modified"
                echo "   ⚙️ Runtime: $runtime"
                echo "   ⏱️ Timeout: ${timeout}s"
                echo "   💾 Memory: ${memory}MB"
                echo "   📦 Code Size: ${code_size} bytes"
                echo "   📝 Description: $description"
                
                # Detailed function configuration validation
                echo "   🔍 Running detailed validation..."
                
                # 1. Check function state and configuration
                func_config=$(aws lambda get-function-configuration \
                  --function-name "$func_name" \
                  --region "$region" \
                  --query '{State:State,StateReason:StateReason,LastUpdateStatus:LastUpdateStatus,PackageType:PackageType}' \
                  --output json 2>/dev/null || echo "{}")
                
                if [[ "$func_config" != "{}" ]]; then
                  func_state=$(echo "$func_config" | jq -r '.State // "Unknown"')
                  state_reason=$(echo "$func_config" | jq -r '.StateReason // "None"')
                  update_status=$(echo "$func_config" | jq -r '.LastUpdateStatus // "Unknown"')
                  package_type=$(echo "$func_config" | jq -r '.PackageType // "Unknown"')
                  
                  echo "   ├─ Function State: $func_state"
                  echo "   ├─ State Reason: $state_reason"
                  echo "   ├─ Last Update Status: $update_status"
                  echo "   └─ Package Type: $package_type"
                  
                  if [[ "$func_state" == "Active" && "$update_status" == "Successful" ]]; then
                    region_active_count=$((region_active_count + 1))
                    total_active=$((total_active + 1))
                    echo "   ✅ Status: Healthy and Active"
                  else
                    region_error_count=$((region_error_count + 1))
                    total_errors=$((total_errors + 1))
                    validation_failed=true
                    echo "   ❌ Status: Issues detected"
                  fi
                else
                  echo "   ❌ Failed to get function configuration"
                  region_error_count=$((region_error_count + 1))
                  total_errors=$((total_errors + 1))
                  validation_failed=true
                fi
                
                # 2. Check CloudWatch Events/EventBridge rules
                echo "   🔍 Checking associated CloudWatch Events..."
                related_rules=$(aws events list-targets-by-rule \
                  --region "$region" \
                  --query "Targets[?contains(Arn, '$func_name')].Id" \
                  --output text 2>/dev/null || echo "")
                
                if [[ -n "$related_rules" && "$related_rules" != "None" ]]; then
                  echo "   ├─ 📅 Associated CloudWatch Rules: Found"
                  
                  # Get rule details
                  rules_for_function=$(aws events list-rules \
                    --region "$region" \
                    --query "Rules[?State=='ENABLED'].Name" \
                    --output text 2>/dev/null || echo "")
                  
                  rule_count=$(echo "$rules_for_function" | wc -w)
                  echo "   └─ 📊 Active Rules Count: $rule_count"
                else
                  echo "   └─ ⚠️ No CloudWatch Events rules found"
                fi
                
                # 3. Check recent executions and errors
                echo "   🔍 Checking recent executions..."
                
                # Get CloudWatch logs for the function (last 24 hours)
                log_group="/aws/lambda/$func_name"
                
                recent_errors=$(aws logs filter-log-events \
                  --log-group-name "$log_group" \
                  --region "$region" \
                  --start-time $(( $(date +%s) * 1000 - 86400000 )) \
                  --filter-pattern "ERROR" \
                  --query 'length(events)' \
                  --output text 2>/dev/null || echo "0")
                
                if [[ "$recent_errors" -gt 0 ]]; then
                  echo "   ├─ ⚠️ Recent Errors: $recent_errors (last 24h)"
                else
                  echo "   ├─ ✅ Recent Errors: None (last 24h)"
                fi
                
                # 4. Check function permissions and policies
                echo "   ├─ 🔐 Checking IAM permissions..."
                
                execution_role=$(aws lambda get-function \
                  --function-name "$func_name" \
                  --region "$region" \
                  --query 'Configuration.Role' \
                  --output text 2>/dev/null || echo "")
                
                if [[ -n "$execution_role" && "$execution_role" != "None" ]]; then
                  role_name=$(basename "$execution_role")
                  echo "   ├─ 📋 Execution Role: $role_name"
                  
                  # Check if role exists and is accessible
                  role_check=$(aws iam get-role --role-name "$role_name" --query 'Role.RoleName' --output text 2>/dev/null || echo "Error")
                  if [[ "$role_check" != "Error" ]]; then
                    echo "   └─ ✅ IAM Role: Accessible"
                  else
                    echo "   └─ ❌ IAM Role: Access issues"
                  fi
                else
                  echo "   └─ ❌ Execution Role: Not found"
                fi
                
                echo ""
              fi
            done <<< "$LAMBDA_FUNCTIONS"
            
            echo "📊 Region Summary ($region):"
            echo "   ├─ Total Lambda functions: $region_lambda_count"
            echo "   ├─ Active & Healthy: $region_active_count"
            echo "   └─ With Issues: $region_error_count"
            echo ""
          done
          
          # Overall CloudWatch Events validation
          echo ""
          echo "🔍 Overall CloudWatch Events Validation"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          total_rules=0
          for region in "${REGION_ARRAY[@]}"; do
            region=$(echo "$region" | xargs)
            
            echo "📍 Region: $region"
            
            rules=$(aws events list-rules \
              --name-prefix custodian \
              --region "$region" \
              --query 'Rules[].{Name:Name,State:State,ScheduleExpression:ScheduleExpression,EventPattern:EventPattern}' \
              --output json 2>/dev/null || echo "[]")
            
            region_rules_count=$(echo "$rules" | jq 'length')
            total_rules=$((total_rules + region_rules_count))
            
            if [[ "$region_rules_count" -gt 0 ]]; then
              echo "   ✅ CloudWatch Rules: $region_rules_count found"
              
              # Show rule details
              echo "$rules" | jq -r '.[] | "   ├─ \(.Name): \(.State) \(if .ScheduleExpression then "[\(.ScheduleExpression)]" else "[Event-driven]" end)"'
            else
              echo "   ⚠️ CloudWatch Rules: None found"
            fi
            echo ""
          done
          
          # Final validation summary
          echo ""
          echo "📊 COMPREHENSIVE VALIDATION SUMMARY"
          echo "════════════════════════════════════════════════════════════"
          echo "🌍 Regions validated: $(echo "$REGIONS" | tr ',' ' ')"
          echo "🏢 Target accounts: $TARGET_ACCOUNTS"
          echo "📦 Total Lambda functions: $total_lambdas"
          echo "✅ Active & Healthy functions: $total_active"
          echo "❌ Functions with issues: $total_errors"
          echo "📅 Total CloudWatch rules: $total_rules"
          echo ""
          
          # Calculate success rate
          if [[ "$total_lambdas" -gt 0 ]]; then
            success_rate=$(( (total_active * 100) / total_lambdas ))
            echo "📈 Success Rate: $success_rate% ($total_active/$total_lambdas)"
          else
            success_rate=0
            echo "📈 Success Rate: N/A (no functions found)"
          fi
          echo ""
          
          # Final determination
          if [[ "$total_lambdas" -eq 0 ]]; then
            echo "⚠️ VALIDATION RESULT: NO FUNCTIONS FOUND"
            echo "💡 Possible reasons:"
            echo "   • No policies deployed with Lambda mode (periodic/cloudtrail)"
            echo "   • Different function naming convention used"
            echo "   • Wrong region or account specified"
            echo "   • Deployment not yet completed"
          elif [[ "$validation_failed" == true || "$total_errors" -gt 0 ]]; then
            echo "❌ VALIDATION RESULT: FAILED"
            echo "🚫 Some Lambda functions have critical issues"
            echo "🔧 Recommendation: Review function logs and configurations"
            exit 1
          elif [[ "$success_rate" -eq 100 && "$total_lambdas" -gt 0 ]]; then
            echo "✅ VALIDATION RESULT: PASSED"
            echo "🎯 All Lambda functions are healthy and operational"
            echo "🚀 Cloud Custodian deployment is fully functional"
          elif [[ "$success_rate" -ge 80 ]]; then
            echo "⚠️ VALIDATION RESULT: MOSTLY SUCCESSFUL"
            echo "📊 Most functions are working but some issues detected"
            echo "🔧 Recommendation: Review functions with issues"
          else
            echo "❌ VALIDATION RESULT: MULTIPLE ISSUES"
            echo "🚫 Significant number of functions have problems"
            echo "🔧 Recommendation: Review deployment and function configurations"
            exit 1
          fi
          
          echo ""
          echo "✅ Standalone Lambda validation completed"

  notify:
    name: 'Demo Completion Notification'
    runs-on: ubuntu-latest
    needs: [validate, deploy, validate-deployed-lambdas, validate-lambdas, verify-deployment, setup-validation, security-demo-guardduty, security-demo-config, security-demo-securityhub, security-demo-all, resource-demo-ec2, cleanup-demo-resources]
    if: always() && github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Generate Final Summary
        run: |
          echo "🎯 Cloud Custodian Demo & Policy Management Complete" >> $GITHUB_STEP_SUMMARY
          echo "====================================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Operation**: ${{ github.event.inputs.operation_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add Lambda validation results if deployment occurred
          if [[ "${{ contains(github.event.inputs.operation_type, 'deploy') }}" == "true" ]]; then
            echo "## 🔍 Lambda Validation Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            lambda_validation_result="${{ needs.validate-deployed-lambdas.outputs.lambda-validation-passed }}"
            lambda_count="${{ needs.validate-deployed-lambdas.outputs.lambda-count }}"
            active_lambdas="${{ needs.validate-deployed-lambdas.outputs.active-lambdas }}"
            
            if [[ "$lambda_validation_result" == "true" ]]; then
              echo "✅ **Lambda Validation**: PASSED" >> $GITHUB_STEP_SUMMARY
              echo "📦 **Total Functions**: $lambda_count" >> $GITHUB_STEP_SUMMARY
              echo "🟢 **Active Functions**: $active_lambdas" >> $GITHUB_STEP_SUMMARY
              echo "📈 **Success Rate**: 100%" >> $GITHUB_STEP_SUMMARY
            elif [[ "$lambda_validation_result" == "partial" ]]; then
              echo "⚠️ **Lambda Validation**: PARTIAL SUCCESS" >> $GITHUB_STEP_SUMMARY
              echo "📦 **Total Functions**: $lambda_count" >> $GITHUB_STEP_SUMMARY
              echo "🟡 **Active Functions**: $active_lambdas" >> $GITHUB_STEP_SUMMARY
              echo "💡 **Note**: Some functions may still be deploying" >> $GITHUB_STEP_SUMMARY
            elif [[ "$lambda_validation_result" == "warning" ]]; then
              echo "⚠️ **Lambda Validation**: WARNING" >> $GITHUB_STEP_SUMMARY
              echo "📦 **Total Functions**: $lambda_count" >> $GITHUB_STEP_SUMMARY
              echo "💡 **Note**: No Lambda functions found - policies may not be configured for Lambda deployment" >> $GITHUB_STEP_SUMMARY
            elif [[ "$lambda_validation_result" == "false" ]]; then
              echo "❌ **Lambda Validation**: FAILED" >> $GITHUB_STEP_SUMMARY
              echo "📦 **Total Functions**: $lambda_count" >> $GITHUB_STEP_SUMMARY
              echo "🔴 **Active Functions**: $active_lambdas" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Status**: Some Lambda functions have errors" >> $GITHUB_STEP_SUMMARY
            else
              echo "❓ **Lambda Validation**: UNKNOWN" >> $GITHUB_STEP_SUMMARY
              echo "💡 **Note**: Lambda validation may have been skipped" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Detect Changed Policies
        id: change-detection
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          echo "🔍 Detecting changed policies..."
          cd c7n
          
          # Set up git refs for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main
            base_ref="origin/main"
            head_ref="HEAD"
            echo "📋 Comparing PR changes: $base_ref → $head_ref"
          else
            # For push events, compare with previous commit
            base_ref="HEAD~1"
            head_ref="HEAD"
            echo "📋 Comparing push changes: $base_ref → $head_ref"
          fi
          
          # Check for changed policy files specifically in c7n/policies directory
          changed_files=$(git diff --name-only "$base_ref" "$head_ref" -- policies/ 2>/dev/null || echo "")
          echo "📄 Changed policy files in c7n/policies/: $changed_files"
          
          changed_policies=""
          
          # Use c7n-policystream if available for more accurate detection
          if command -v c7n-policystream >/dev/null 2>&1; then
            echo "🔍 Using c7n-policystream for advanced change detection..."
            policy_changes=$(c7n-policystream diff --source "$base_ref" --target "$head_ref" 2>/dev/null || echo "")
            if [ -n "$policy_changes" ]; then
              changed_policies=$(echo "$policy_changes" | yq -r '.policies[]?.name' 2>/dev/null || echo "")
            fi
          fi
          
          # Fallback: analyze changed files directly
          if [ -z "$changed_policies" ] && [ -n "$changed_files" ]; then
            echo "🔍 Fallback: Analyzing changed files directly..."
            for file in $changed_files; do
              if [[ "$file" == *.yml ]] && [[ -f "$file" ]]; then
                echo "  📄 Analyzing: $file"
                file_policies=$(yq -r '.policies[]?.name' "$file" 2>/dev/null || echo "")
                if [ -n "$file_policies" ]; then
                  changed_policies="$changed_policies $file_policies"
                  echo "    Found policies: $file_policies"
                fi
              fi
            done
          fi
          
          # Clean up the policy list (remove duplicates and empty entries)
          if [ -n "$changed_policies" ]; then
            changed_policies=$(echo "$changed_policies" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          fi
          
          echo ""
          echo "📊 Change Detection Summary:"
          echo "============================"
          echo "  Changed files: $(echo "$changed_files" | wc -w)"
          echo "  Changed policies: $(echo "$changed_policies" | wc -w)"
          echo "  Policy names: $changed_policies"
          echo ""
          
          if [ -n "$changed_policies" ]; then
            echo "✅ Policy changes detected - dry-run will be performed"
          else
            echo "📝 No policy changes detected - skipping dry-run"
          fi
          
          echo "policies=$changed_policies" >> $GITHUB_OUTPUT
      
      - name: Dry Run Changed Policies
        if: steps.change-detection.outputs.policies != ''
        run: |
          echo "🧪 Running dry-run on changed policies..."
          cd c7n
          
          mkdir -p ../artifacts/validation-dryrun
          
          # Create a single-account config for validation using development account
          cat > validation-accounts.yml << EOF
          accounts:
          - account_id: '172327596604'
            name: engg
            regions:
            - us-east-1
            role: arn:aws:iam::172327596604:role/CloudCustodian-ExecutionRole
            vars:
              environment: engg
          EOF
          
          changed_policies="${{ steps.change-detection.outputs.policies }}"
          policy_count=0
          tested_count=0
          
          echo "📋 Changed policies detected: $changed_policies"
          echo ""
          
          for policy in $changed_policies; do
            if [ -n "$policy" ]; then
              policy_count=$((policy_count + 1))
              echo "🔍 Testing policy: $policy"
              
              # Find which file contains this policy
              found_file=""
              for policy_file in policies/*.yml; do
                if grep -q "name: $policy" "$policy_file"; then
                  found_file="$policy_file"
                  break
                fi
              done
              
              if [ -n "$found_file" ]; then
                echo "  📄 Found in: $found_file"
                echo "  🚀 Running dry-run against account: engg"
                
                if c7n-org run -c validation-accounts.yml -u "$found_file" -s ../artifacts/validation-dryrun -p "$policy" --dryrun; then
                  echo "  ✅ Dry-run completed successfully for: $policy"
                  tested_count=$((tested_count + 1))
                else
                  echo "  ⚠️ Dry-run encountered issues for: $policy (check artifacts for details)"
                  # Continue with other policies even if one fails
                fi
              else
                echo "  ❌ Policy file not found for: $policy"
              fi
              echo ""
            fi
          done
          
          echo "📊 Changed Policy Dry-Run Summary:"
          echo "================================="
          echo "  Changed policies detected: $policy_count"
          echo "  Successfully tested: $tested_count"
          echo ""
          
          if [ "$tested_count" -eq "$policy_count" ] && [ "$policy_count" -gt 0 ]; then
            echo "✅ All changed policies completed dry-run testing"
          elif [ "$policy_count" -gt 0 ]; then
            echo "⚠️ Some changed policies had issues during dry-run (see artifacts for details)"
          else
            echo "📝 No changed policies to test"
          fi
          
          echo "✅ Dry-run validation completed"
      
      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-validation-${{ github.run_number }}
          path: artifacts/validation-dryrun/
          retention-days: 30
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const validationPassed = '${{ needs.validate.outputs.validation-passed }}' === 'true';
            const changedPolicies = '${{ steps.change-detection.outputs.policies }}';
            
            let comment = `## 🛡️ Cloud Custodian Policy Validation\n\n`;
            
            if (validationPassed) {
              comment += `✅ **Validation Result**: All policies passed syntax validation\n\n`;
            } else {
              comment += `❌ **Validation Result**: Policy validation failed\n\n`;
            }
            
            if (changedPolicies.trim()) {
              const policyList = changedPolicies.trim().split(' ').filter(p => p.length > 0);
              comment += `**Changed Policies** (${policyList.length} detected):\n`;
              policyList.forEach(policy => {
                comment += `- \`${policy}\`\n`;
              });
              comment += `\n🧪 **Dry Run**: Completed for changed policies against \`engg\` account\n`;
              comment += `📊 **Coverage**: Only changed policies tested (efficient approach)\n\n`;
            } else {
              comment += `**Changed Policies**: None detected\n\n`;
            }
            
            comment += `**Artifacts**: Download validation artifacts to review detailed results\n`;
            comment += `**Test Account**: \`engg\` (172327596604)\n`;
            comment += `**Next Steps**: ${validationPassed ? '✅ Ready for deployment' : '❌ Fix validation errors before proceeding'}\n\n`;
            
            if (changedPolicies.trim()) {
              comment += `### 🔍 What was tested:\n`;
              comment += `- **Syntax Validation**: All policy files checked\n`;
              comment += `- **Schema Validation**: Cloud Custodian schema compliance\n`;
              comment += `- **Dry Run**: Changed policies tested against AWS resources\n`;
              comment += `- **Account**: engg environment for safe testing\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });