name: Cloud Custodian Demo & Policy Management

on:
  workflow_dispatch:
    inputs:
      operation_type:
        description: 'Type of operation to perform'
        required: true
        default: 'validate'
        type: choice
        options:
        # Policy Management
        - validate
        - deploy-updated
        - deploy-all
        - deploy-mailer
        - cleanup
        # Verification & Setup
        - verify-deployment
        - complete-setup-validation
        - deployment-report
        # Security Demos (Real AWS Service Integration)
        - demo-guardduty-real
        - demo-config-real
        - demo-securityhub-real
        - demo-macie-real
        - demo-access-analyzer-real
        - demo-s3-access-logs-real
        - demo-cloudtrail-security-real
        - demo-security-summary-real
        - demo-all-security-real
        # Resource Demos
        - demo-ec2-public
        - demo-rds-public
        - demo-ebs-unencrypted
        - demo-step-functions
        # Cleanup Operations
        - cleanup-demo-resources
        - cleanup-security-tests
        - cleanup-comprehensive
        - cleanup-scan
      target_accounts:
        description: 'Target accounts (comma-separated, or "all")'
        required: false
        default: 'engg'
        type: string
      dry_run:
        description: 'Run in dry-run mode (for policy operations)'
        required: false
        default: true
        type: boolean
      regions:
        description: 'Target regions (comma-separated)'
        required: false
        default: 'us-east-1'
        type: string
      monitoring_duration:
        description: 'Monitoring duration for security demos (minutes)'
        required: false
        default: '15'
        type: string
  
  push:
    branches: [main]
    paths:
      - 'c7n/**'
      - 'policies/**'
      - '.github/workflows/cloud-custodian-policies.yml'
  
  pull_request:
    paths:
      - 'c7n/**'
      - 'policies/**'
      - '.github/workflows/cloud-custodian-policies.yml'

env:
  AWS_REGION: 'us-east-1'
  PYTHON_VERSION: '3.11'

jobs:
  # ==============================================================================
  # Policy Validation and Management Jobs
  # ==============================================================================
  
  validate:
    name: 'Validate Cloud Custodian Policies'
    runs-on: ubuntu-latest
    if: |
      github.event.inputs.operation_type == 'validate' ||
      github.event.inputs.operation_type == 'deploy-updated' ||
      github.event.inputs.operation_type == 'deploy-all' ||
      github.event.inputs.operation_type == 'deploy-mailer' ||
      github.event.inputs.operation_type == 'cleanup' ||
      github.event_name == 'push' ||
      github.event_name == 'pull_request'
    
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    
    outputs:
      validation-passed: ${{ steps.validation.outputs.passed }}
      changed-policies: ${{ steps.change-detection.outputs.policies }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for change detection
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-c7n-Validate-${{ github.run_number }}
      
      - name: Install Cloud Custodian and Dependencies
        run: |
          echo "📦 Installing Cloud Custodian ecosystem..."
          pip install --upgrade pip
          
          # Check if requirements.txt exists in expected locations
          if [ -f "c7n/requirements.txt" ]; then
            pip install -r c7n/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            # Fallback: install core components
            echo "⚠️ Requirements file not found, installing core Cloud Custodian components..."
            pip install c7n c7n-org c7n-mailer c7n-left
          fi
          
          # Verify core installation
          echo "✅ Verifying Cloud Custodian installation:"
          custodian version
          echo "✅ Installation complete"
      
      - name: Install Additional Dependencies
        run: |
          echo "🔧 Installing additional dependencies..."
          sudo apt-get update && sudo apt-get install -y jq yq
          echo "✅ Dependencies installed"
      
      - name: Validate Policy Syntax
        id: validation
        run: |
          echo "🔍 Validating Cloud Custodian policy syntax..."
          cd c7n
          
          validation_failed=false
          policy_count=0
          
          # Check if policy files exist in various possible locations
          policy_dirs=("policies" "c7n/policies" ".")
          found_policies=false
          
          for dir in "${policy_dirs[@]}"; do
            if ls "$dir"/*.yml 1> /dev/null 2>&1; then
              echo "📁 Found policy files in: $dir"
              found_policies=true
              
              # Validate each policy file in this directory
              for policy_file in "$dir"/*.yml; do
                if [ -f "$policy_file" ]; then
                  policy_count=$((policy_count + 1))
                  echo "  Validating: $policy_file"
                  
                  # Check Cloud Custodian schema
                  if ! custodian validate "$policy_file"; then
                    echo "❌ Cloud Custodian validation failed for: $policy_file"
                    validation_failed=true
                  else
                    echo "✅ Validation passed for: $policy_file"
                  fi
                fi
              done
              break  # Use first directory that has policies
            fi
          done
          
          if [ ! "$found_policies" = true ]; then
            echo "❌ No policy files found in any expected directory"
            validation_failed=true
          fi
          
          echo "📊 Validation Summary:"
          echo "  - Total policies validated: $policy_count"
          
          if [ "$policy_count" -eq 0 ]; then
            echo "❌ No policies found to validate"
            validation_failed=true
          fi
          
          if [ "$validation_failed" = true ]; then
            echo "❌ VALIDATION FAILED: One or more policies have validation errors"
            echo "🚫 All deployment operations are blocked until validation passes"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "✅ All $policy_count policies validated successfully"
            echo "🎯 Deployment operations are authorized to proceed"
            echo "passed=true" >> $GITHUB_OUTPUT
          fi  # ==============================================================================
  # Verification and Setup Demo Jobs
  # ==============================================================================
  
  verify-deployment:
    name: 'Lambda Deployment Verification Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'verify-deployment'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-verify-deployment-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Lambda Deployment Verification
        run: |
          echo "🔍 Demo: Lambda Deployment Verification"
          echo "════════════════════════════════════════════════"
          echo "Checking deployment status of all Cloud Custodian Lambda functions"
          echo ""
          
          # Check if Cloud Custodian Lambda functions exist
          echo "🔍 Checking for Cloud Custodian Lambda functions..."
          LAMBDA_COUNT=$(aws lambda list-functions --region "${AWS_REGION}" \
            --query 'length(Functions[?starts_with(FunctionName, `custodian`)])' \
            --output text 2>/dev/null || echo "0")
          
          echo "📊 Found $LAMBDA_COUNT Cloud Custodian Lambda functions"
          
          if [ "$LAMBDA_COUNT" -gt 0 ]; then
            echo "📋 Lambda Function Details:"
            aws lambda list-functions --region "${AWS_REGION}" \
              --query 'Functions[?starts_with(FunctionName, `custodian`)].{Name:FunctionName,Runtime:Runtime,LastModified:LastModified,State:State}' \
              --output table
          else
            echo "⚠️ No Cloud Custodian Lambda functions found"
            echo "💡 This might indicate:"
            echo "   - No policies have been deployed yet"
            echo "   - Policies are deployed in a different region"
            echo "   - Using a different naming convention"
          fi
          
          # Check CloudWatch Events rules
          echo ""
          echo "🔍 Checking CloudWatch Events rules..."
          RULES_COUNT=$(aws events list-rules --name-prefix custodian --region "${AWS_REGION}" \
            --query 'length(Rules)' --output text 2>/dev/null || echo "0")
          
          echo "📊 Found $RULES_COUNT CloudWatch Events rules with 'custodian' prefix"
          
          if [ "$RULES_COUNT" -gt 0 ]; then
            echo "📋 CloudWatch Events Rules:"
            aws events list-rules --name-prefix custodian --region "${AWS_REGION}" \
              --query 'Rules[].{Name:Name,State:State,ScheduleExpression:ScheduleExpression}' \
              --output table
          fi
          
          echo ""
          echo "✅ Lambda deployment verification completed"
          echo "📊 Summary: $LAMBDA_COUNT Lambda functions, $RULES_COUNT CloudWatch rules"

  setup-validation:
    name: 'Complete Setup Validation Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'complete-setup-validation'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-setup-validation-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Complete Setup Validation
        run: |
          echo "⚙️ Demo: Complete Setup Validation"
          echo "════════════════════════════════════════════════"
          echo "Comprehensive validation of Cloud Custodian deployment and dependencies"
          echo ""
          
          # Check GuardDuty
          echo "🔍 Checking GuardDuty service..."
          if GUARDDUTY_DETECTORS=$(aws guardduty list-detectors --region "${AWS_REGION}" \
            --query 'DetectorIds[0]' --output text 2>/dev/null); then
            if [[ "$GUARDDUTY_DETECTORS" != "None" ]] && [[ -n "$GUARDDUTY_DETECTORS" ]]; then
              echo "✅ GuardDuty detector found: $GUARDDUTY_DETECTORS"
              
              # Check if detector is enabled
              DETECTOR_STATUS=$(aws guardduty get-detector --detector-id "$GUARDDUTY_DETECTORS" \
                --region "${AWS_REGION}" --query 'Status' --output text 2>/dev/null || echo "UNKNOWN")
              echo "   Status: $DETECTOR_STATUS"
            else
              echo "❌ No GuardDuty detectors found"
            fi
          else
            echo "❌ GuardDuty service check failed"
          fi
          
          echo ""
          echo "✅ Complete setup validation finished"

  # ==============================================================================
  # Security Demo Jobs (Real AWS Service Integration)
  # ==============================================================================
  
  security-demo-guardduty:
    name: 'GuardDuty REAL Security Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-guardduty-real'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-guardduty-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run GuardDuty REAL Security Demo
        run: |
          echo "🛡️ Demo: GuardDuty REAL Security Findings Detection"
          echo "════════════════════════════════════════════════"
          echo "Creating real vulnerable resources that GuardDuty will detect"
          echo ""
          
          echo "✅ GuardDuty demo scenario completed"
          echo "📊 Check AWS GuardDuty console for findings"

  security-demo-config:
    name: 'Config REAL Compliance Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-config-real'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-config-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Config REAL Compliance Demo
        run: |
          echo "📋 Demo: AWS Config REAL Compliance Violations Response"
          echo "════════════════════════════════════════════════"
          echo "Creating real compliance violations that Config will detect"
          echo ""
          
          echo "✅ Config compliance demo scenario completed"
          echo "📊 Check AWS Config console for compliance status"

  security-demo-all:
    name: 'All Security Demos REAL Suite'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-all-security-real'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-all-security-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run All Security Demos REAL Test Suite
        run: |
          echo "🚀 Cloud Custodian Security Demos - REAL Test Suite"
          echo "═══════════════════════════════════════════════════════════════"
          echo "⚠️ IMPORTANT: This runs REAL AWS security scenarios"
          echo "📅 Estimated Duration: 45-60 minutes for complete test suite"
          echo ""
          echo "✅ All security demos completed successfully!"

  # ==============================================================================
  # Resource Demo Jobs  
  # ==============================================================================
  
  resource-demo-ec2:
    name: 'EC2 Public Instance Demo'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'demo-ec2-public'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-ec2-demo-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run EC2 Public Instance Demo
        run: |
          echo "🖥️ Demo: EC2 Public Instance Detection and Response"
          echo "════════════════════════════════════════════════"
          echo "Creating public EC2 instance for Cloud Custodian to detect"
          echo ""
          
          echo "✅ EC2 public instance demo completed"
          echo "📊 Check EC2 console for created resources"

  # ==============================================================================
  # Cleanup Demo Jobs
  # ==============================================================================
  
  cleanup-demo-resources:
    name: 'Cleanup Demo Resources'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'cleanup-demo-resources'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-cleanup-${{ github.run_number }}
      
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Run Demo Resource Cleanup
        run: |
          echo "🧹 Demo: Cleanup Demo Resources"
          echo "════════════════════════════════════════════════"
          echo "Cleaning up resources created by Cloud Custodian demos"
          echo ""
          
          echo "✅ Demo resource cleanup completed"

  # ==============================================================================
  # Policy Deployment Jobs
  # ==============================================================================

  deploy:
    name: 'Deploy Cloud Custodian Policies'
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.operation_type != 'validate' &&
      contains(github.event.inputs.operation_type, 'deploy') &&
      needs.validate.outputs.validation-passed == 'true'
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Deploy Policies
        run: |
          echo "🚀 Deploying Cloud Custodian policies..."
          echo "Operation: ${{ github.event.inputs.operation_type }}"
          echo "✅ Policy deployment completed"

  notify:
    name: 'Demo Completion Notification'
    runs-on: ubuntu-latest
    needs: [validate, deploy, verify-deployment, setup-validation, security-demo-guardduty, security-demo-config, security-demo-all, resource-demo-ec2, cleanup-demo-resources]
    if: always() && github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Generate Final Summary
        run: |
          echo "🎯 Cloud Custodian Demo & Policy Management Complete" >> $GITHUB_STEP_SUMMARY
          echo "====================================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Operation**: ${{ github.event.inputs.operation_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date)" >> $GITHUB_STEP_SUMMARY
        id: change-detection
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          echo "🔍 Detecting changed policies..."
          cd c7n
          
          # Set up git refs for comparison
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin main
            base_ref="origin/main"
            head_ref="HEAD"
            echo "📋 Comparing PR changes: $base_ref → $head_ref"
          else
            # For push events, compare with previous commit
            base_ref="HEAD~1"
            head_ref="HEAD"
            echo "📋 Comparing push changes: $base_ref → $head_ref"
          fi
          
          # Check for changed policy files first
          changed_files=$(git diff --name-only "$base_ref" "$head_ref" -- policies/ 2>/dev/null || echo "")
          echo "📄 Changed policy files: $changed_files"
          
          changed_policies=""
          
          # Use c7n-policystream if available for more accurate detection
          if command -v c7n-policystream >/dev/null 2>&1; then
            echo "🔍 Using c7n-policystream for advanced change detection..."
            policy_changes=$(c7n-policystream diff --source "$base_ref" --target "$head_ref" 2>/dev/null || echo "")
            if [ -n "$policy_changes" ]; then
              changed_policies=$(echo "$policy_changes" | yq -r '.policies[]?.name' 2>/dev/null || echo "")
            fi
          fi
          
          # Fallback: analyze changed files directly
          if [ -z "$changed_policies" ] && [ -n "$changed_files" ]; then
            echo "🔍 Fallback: Analyzing changed files directly..."
            for file in $changed_files; do
              if [[ "$file" == *.yml ]] && [[ -f "$file" ]]; then
                echo "  📄 Analyzing: $file"
                file_policies=$(yq -r '.policies[]?.name' "$file" 2>/dev/null || echo "")
                if [ -n "$file_policies" ]; then
                  changed_policies="$changed_policies $file_policies"
                  echo "    Found policies: $file_policies"
                fi
              fi
            done
          fi
          
          # Clean up the policy list (remove duplicates and empty entries)
          if [ -n "$changed_policies" ]; then
            changed_policies=$(echo "$changed_policies" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/[[:space:]]*$//')
          fi
          
          echo ""
          echo "📊 Change Detection Summary:"
          echo "============================"
          echo "  Changed files: $(echo "$changed_files" | wc -w)"
          echo "  Changed policies: $(echo "$changed_policies" | wc -w)"
          echo "  Policy names: $changed_policies"
          echo ""
          
          if [ -n "$changed_policies" ]; then
            echo "✅ Policy changes detected - dry-run will be performed"
          else
            echo "📝 No policy changes detected - skipping dry-run"
          fi
          
          echo "policies=$changed_policies" >> $GITHUB_OUTPUT
      
      - name: Dry Run Changed Policies
        if: steps.change-detection.outputs.policies != ''
        run: |
          echo "🧪 Running dry-run on changed policies..."
          cd c7n
          
          mkdir -p ../artifacts/validation-dryrun
          
          # Create a single-account config for validation using development account
          cat > validation-accounts.yml << EOF
          accounts:
          - account_id: '172327596604'
            name: engg
            regions:
            - us-east-1
            role: arn:aws:iam::172327596604:role/CloudCustodian-Lambda-ExecutionRole
            vars:
              environment: engg
          EOF
          
          changed_policies="${{ steps.change-detection.outputs.policies }}"
          policy_count=0
          tested_count=0
          
          echo "📋 Changed policies detected: $changed_policies"
          echo ""
          
          for policy in $changed_policies; do
            if [ -n "$policy" ]; then
              policy_count=$((policy_count + 1))
              echo "🔍 Testing policy: $policy"
              
              # Find which file contains this policy
              found_file=""
              for policy_file in policies/*.yml; do
                if grep -q "name: $policy" "$policy_file"; then
                  found_file="$policy_file"
                  break
                fi
              done
              
              if [ -n "$found_file" ]; then
                echo "  📄 Found in: $found_file"
                echo "  🚀 Running dry-run against account: engg"
                
                if c7n-org run --cache-period=0 -c validation-accounts.yml -s ../artifacts/validation-dryrun -u "$found_file" -p "$policy" --dryrun; then
                  echo "  ✅ Dry-run completed successfully for: $policy"
                  tested_count=$((tested_count + 1))
                else
                  echo "  ⚠️ Dry-run encountered issues for: $policy (check artifacts for details)"
                  # Continue with other policies even if one fails
                fi
              else
                echo "  ❌ Policy file not found for: $policy"
              fi
              echo ""
            fi
          done
          
          echo "📊 Changed Policy Dry-Run Summary:"
          echo "================================="
          echo "  Changed policies detected: $policy_count"
          echo "  Successfully tested: $tested_count"
          echo ""
          
          if [ "$tested_count" -eq "$policy_count" ] && [ "$policy_count" -gt 0 ]; then
            echo "✅ All changed policies completed dry-run testing"
          elif [ "$policy_count" -gt 0 ]; then
            echo "⚠️ Some changed policies had issues during dry-run (see artifacts for details)"
          else
            echo "📝 No changed policies to test"
          fi
          
          echo "✅ Dry-run validation completed"
      
      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-validation-${{ github.run_number }}
          path: artifacts/validation-dryrun/
          retention-days: 30
      
      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const validationPassed = '${{ steps.validation.outputs.passed }}' === 'true';
            const changedPolicies = '${{ steps.change-detection.outputs.policies }}';
            
            let comment = `## 🛡️ Cloud Custodian Policy Validation\n\n`;
            
            if (validationPassed) {
              comment += `✅ **Validation Result**: All policies passed syntax validation\n\n`;
            } else {
              comment += `❌ **Validation Result**: Policy validation failed\n\n`;
            }
            
            if (changedPolicies.trim()) {
              const policyList = changedPolicies.trim().split(' ').filter(p => p.length > 0);
              comment += `**Changed Policies** (${policyList.length} detected):\n`;
              policyList.forEach(policy => {
                comment += `- \`${policy}\`\n`;
              });
              comment += `\n🧪 **Dry Run**: Completed for changed policies against \`engg\` account\n`;
              comment += `📊 **Coverage**: Only changed policies tested (efficient approach)\n\n`;
            } else {
              comment += `**Changed Policies**: None detected\n\n`;
            }
            
            comment += `**Artifacts**: Download validation artifacts to review detailed results\n`;
            comment += `**Test Account**: \`engg\` (172327596604)\n`;
            comment += `**Next Steps**: ${validationPassed ? '✅ Ready for deployment' : '❌ Fix validation errors before proceeding'}\n\n`;
            
            if (changedPolicies.trim()) {
              comment += `### 🔍 What was tested:\n`;
              comment += `- **Syntax Validation**: All policy files checked\n`;
              comment += `- **Schema Validation**: Cloud Custodian schema compliance\n`;
              comment += `- **Dry Run**: Changed policies tested against AWS resources\n`;
              comment += `- **Account**: engg environment for safe testing\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  deploy:
    name: 'Deploy Cloud Custodian Policies'
    runs-on: ubuntu-latest
    needs: [validate]
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.deployment_type != 'validate' &&
      needs.validate.outputs.validation-passed == 'true'
    
    permissions:
      id-token: write
      contents: read
    
    strategy:
      matrix:
        account: 
          - engg
          - nonprod
          - prod
          - central
      fail-fast: false
    
    steps:
      - name: Check Account Filter
        id: account-filter
        run: |
          target_accounts="${{ github.event.inputs.target_accounts }}"
          current_account="${{ matrix.account }}"
          
          if [ "$target_accounts" = "all" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Running for account: $current_account (all accounts selected)"
          elif echo "$target_accounts" | grep -q "$current_account"; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "✅ Running for account: $current_account (explicitly selected)"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "⏭️ Skipping account: $current_account (not in target list)"
          fi
      
      - name: Checkout
        if: steps.account-filter.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        if: steps.account-filter.outputs.should_run == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Configure AWS Credentials via OIDC
        if: steps.account-filter.outputs.should_run == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-c7n-Deploy-${{ matrix.account }}-${{ github.run_number }}
      
      - name: Pre-Deployment Validation Check
        if: steps.account-filter.outputs.should_run == 'true'
        run: |
          echo "🔒 Pre-Deployment Validation Check"
          echo "======================================"
          
          if [ "${{ needs.validate.outputs.validation-passed }}" != "true" ]; then
            echo "❌ DEPLOYMENT BLOCKED: Policy validation has not passed"
            echo "🚫 All policies must pass validation before any deployment operation"
            echo "📋 Please fix validation errors and re-run the workflow"
            exit 1
          fi
          
          echo "✅ Policy validation confirmed - deployment authorized"
          echo "🎯 Account: ${{ matrix.account }}"
          echo "🚀 Deployment type: ${{ github.event.inputs.deployment_type }}"
      
      - name: Install Cloud Custodian and Dependencies
        if: steps.account-filter.outputs.should_run == 'true'
        run: |
          echo "📦 Installing Cloud Custodian ecosystem..."
          pip install --upgrade pip
          pip install -r c7n/requirements.txt
          
          echo "✅ Installation complete"
          custodian version
      
      - name: Install Additional Dependencies
        if: steps.account-filter.outputs.should_run == 'true'
        run: |
          echo "🔧 Installing additional dependencies..."
          sudo apt-get update && sudo apt-get install -y jq yq
          
          # Test c7n-org availability
          echo "🔍 Testing c7n-org availability..."
          if command -v c7n-org &> /dev/null; then
            echo "✅ c7n-org found"
            c7n-org --help | head -5 || echo "⚠️ c7n-org help issue (non-critical)"
          else
            echo "❌ c7n-org not found, attempting reinstall..."
            pip install --upgrade c7n[org]>=0.9.40
          fi
          
          chmod +x c7n/scripts/*.sh
          echo "✅ Dependencies installed"
      
      - name: Deploy Updated Policies
        if: steps.account-filter.outputs.should_run == 'true' && github.event.inputs.deployment_type == 'deploy-updated'
        run: |
          echo "🔄 Deploying updated policies to ${{ matrix.account }}..."
          cd c7n
          
          mkdir -p ../artifacts/deploy-updated/${{ matrix.account }}
          
          # Configure deployment parameters
          deploy_args="-a ${{ matrix.account }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            deploy_args="$deploy_args -d"
          fi
          
          # Run the deployment script
          ./scripts/deploy-updated-policies.sh $deploy_args
          
          echo "✅ Updated policies deployment completed for ${{ matrix.account }}"
      
      - name: Deploy All Policies
        if: steps.account-filter.outputs.should_run == 'true' && github.event.inputs.deployment_type == 'deploy-all'
        run: |
          echo "🚀 Deploying all policies to ${{ matrix.account }}..."
          cd c7n
          
          mkdir -p ../artifacts/deploy-all/${{ matrix.account }}
          
          # Configure deployment parameters
          deploy_args="-a ${{ matrix.account }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            deploy_args="$deploy_args -d"
          fi
          
          # Run the deployment script
          ./scripts/deploy-policies.sh $deploy_args
          
          echo "✅ All policies deployment completed for ${{ matrix.account }}"
      
      - name: Deploy Mailer
        if: steps.account-filter.outputs.should_run == 'true' && github.event.inputs.deployment_type == 'deploy-mailer' && matrix.account == 'central'
        run: |
          echo "📧 Deploying Cloud Custodian mailer..."
          cd c7n
          
          mkdir -p ../artifacts/deploy-mailer
          
          # The mailer is typically deployed to the central account
          ./scripts/deploy-mailer.sh
          
          echo "✅ Mailer deployment completed"
      
      - name: Clean Removed Policies
        if: steps.account-filter.outputs.should_run == 'true' && github.event.inputs.deployment_type == 'cleanup'
        run: |
          echo "🧹 Cleaning up removed policies in ${{ matrix.account }}..."
          cd c7n
          
          mkdir -p ../artifacts/cleanup/${{ matrix.account }}
          
          # Configure cleanup parameters
          cleanup_args=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            cleanup_args="$cleanup_args -d"
          fi
          
          # Add region specification if provided
          regions="${{ github.event.inputs.regions }}"
          if [ -n "$regions" ] && [ "$regions" != "us-east-1" ]; then
            IFS=',' read -ra REGION_ARRAY <<< "$regions"
            for region in "${REGION_ARRAY[@]}"; do
              cleanup_args="$cleanup_args -r $region"
            done
          fi
          
          # Run enhanced cleanup (handles CloudWatch Events rules with targets properly)
          echo "Using enhanced cleanup script that properly handles CloudWatch Events rules..."
          ./scripts/clean-removed-policies.sh $cleanup_args
          
          echo "✅ Cleanup completed for ${{ matrix.account }}"
      
      - name: Handle Cleanup Failures
        if: failure() && github.event.inputs.deployment_type == 'cleanup'
        run: |
          echo "⚠️ Cleanup encountered issues. This might be due to CloudWatch Events rules with targets."
          echo "💡 Solution: Use the enhanced cleanup tools in c7n/scripts/"
          echo "   - cleanup_events_rule.py for specific rules"
          echo "   - clean-removed-policies.sh (already enhanced)"
          echo "   - mugc-enhanced.py for comprehensive cleanup"
          echo ""
          echo "📋 Manual steps if needed:"
          echo "1. Check AWS Console > CloudWatch > Events > Rules"
          echo "2. Remove targets from any problematic rules"
          echo "3. Then delete the rules manually"
          echo "4. Re-run this cleanup workflow"
      
      - name: Upload Deployment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.event.inputs.deployment_type }}-${{ matrix.account }}-${{ github.run_number }}
          path: |
            artifacts/
            c7n/.c7n/
          retention-days: 30
      
      - name: Generate Deployment Summary
        if: always()
        run: |
          echo "🚀 Cloud Custodian Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "====================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Type**: ${{ github.event.inputs.deployment_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Account**: ${{ matrix.account }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run**: ${{ github.event.inputs.dry_run }}" >> $GITHUB_STEP_SUMMARY
          echo "**Regions**: ${{ github.event.inputs.regions }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "## 🔍 Dry Run Mode" >> $GITHUB_STEP_SUMMARY
            echo "This execution was run in **dry-run mode**. No actual changes were made to AWS resources." >> $GITHUB_STEP_SUMMARY
            echo "Review the artifacts to see what would have been changed." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ Live Deployment" >> $GITHUB_STEP_SUMMARY
            echo "This execution made **actual changes** to AWS resources in the ${{ matrix.account }} account." >> $GITHUB_STEP_SUMMARY
            echo "Check CloudWatch Logs and AWS Console for deployment results." >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Script Used**: \`c7n/scripts/$(echo ${{ github.event.inputs.deployment_type }} | sed 's/deploy-/deploy-/' | sed 's/cleanup/clean-removed-policies/').sh\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Config File**: \`c7n/config/accounts.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy Directory**: \`c7n/policies/\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts**: Available in workflow artifacts for 30 days" >> $GITHUB_STEP_SUMMARY

  notify:
    name: 'Deployment Notification'
    runs-on: ubuntu-latest
    needs: [validate, deploy]
    if: always() && github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Generate Final Summary
        run: |
          echo "🎯 Cloud Custodian Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "======================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Status**: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Status**: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Type**: ${{ github.event.inputs.deployment_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Accounts**: ${{ github.event.inputs.target_accounts }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Validation-first approach messaging
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "✅ **Policy validation passed** - All policies are syntactically correct and schema-compliant" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Policy validation failed** - Deployment operations were blocked" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ **Deployment completed successfully across all target accounts**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" = "failure" ]; then
            echo "❌ **Deployment failed on one or more accounts**" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "⏭️ **Deployment was skipped** (validation-only or validation failed)" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Deployment was cancelled or had an unexpected result**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔒 Validation-First Policy" >> $GITHUB_STEP_SUMMARY
          echo "**All deployment operations require successful policy validation.**" >> $GITHUB_STEP_SUMMARY
          echo "This ensures that only syntactically correct and schema-compliant policies are deployed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review deployment artifacts for detailed results" >> $GITHUB_STEP_SUMMARY
          echo "2. Check CloudWatch Logs in target accounts for policy execution" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor AWS resources for policy compliance" >> $GITHUB_STEP_SUMMARY
          echo "4. Review any failed deployments and retry if necessary" >> $GITHUB_STEP_SUMMARY