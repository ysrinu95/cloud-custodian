          else
            echo "🚀 LIVE MODE: Creating real public EC2 instances"
            echo "⚠️ This will create actual AWS resources with public access"
            echo ""
            
            # Run the full EC2 demo
            ./scripts/ec2-public-demo.sh --region "$AWS_REGION" --duration "$MONITORING_DURATION"
            
            echo ""
            echo "✅ EC2 public instance demo completed"
          fi
          
          echo ""
          echo "📊 Next Steps:"
