name: Bootstrap OIDC Authentication

on:
  workflow_dispatch:
    inputs:
      confirm_bootstrap:
        description: 'Type "bootstrap" to confirm you want to create OIDC provider and IAM role'
        required: true
        type: string
      cleanup_existing:
        description: 'Clean up existing resources first (if they exist without state tracking)'
        required: false
        type: boolean
        default: false

env:
  TF_VERSION: '1.8.0'
  AWS_REGION: 'us-east-1'
  TF_STATE_BUCKET: 'ysr95-cloud-custodian-tf-bkt'

jobs:
  bootstrap:
    name: 'Bootstrap OIDC Provider and IAM Role'
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_bootstrap == 'bootstrap'
    
    defaults:
      run:
        working-directory: terraform-bootstrap
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      
      - name: Configure AWS Credentials (Access Keys - Bootstrap Only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Verify AWS Connection
        run: |
          echo "🔍 Verifying AWS connection with access keys..."
          aws sts get-caller-identity
          echo "✅ AWS connection verified"
      
      - name: Check for Existing Resources
        run: |
          echo "🔍 Checking for existing resources that might conflict..."
          
          # Check for existing IAM role
          if aws iam get-role --role-name "GitHubActions-CloudCustodian-Role" 2>/dev/null; then
            echo "⚠️ WARNING: IAM role 'GitHubActions-CloudCustodian-Role' already exists"
            echo "🔄 This bootstrap will update the existing role if needed"
          else
            echo "✅ No conflicting IAM role found"
          fi
          
          # Check for existing OIDC provider
          OIDC_PROVIDERS=$(aws iam list-open-id-connect-providers --query 'OpenIDConnectProviderList[?contains(Arn, `token.actions.githubusercontent.com`)].Arn' --output text 2>/dev/null || echo "")
          if [ -n "$OIDC_PROVIDERS" ]; then
            echo "⚠️ WARNING: GitHub OIDC provider already exists: $OIDC_PROVIDERS"
            echo "🔄 This bootstrap will use the existing provider if compatible"
          else
            echo "✅ No conflicting OIDC provider found"
          fi
          
          # Check for existing policy
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if aws iam get-policy --policy-arn "arn:aws:iam::${ACCOUNT_ID}:policy/CloudCustodianPolicy" 2>/dev/null; then
            echo "⚠️ WARNING: CloudCustodianPolicy already exists"
            echo "🔄 This bootstrap will update the existing policy if needed"
          else
            echo "✅ No conflicting policy found"
          fi
      
      - name: Create terraform.tfvars
        run: |
          cat > terraform.tfvars <<EOF
          aws_region = "${{ env.AWS_REGION }}"
          github_repository = "${{ github.repository }}"
          github_actions_role_name = "GitHubActions-CloudCustodian-Role"
          environment = "prod"
          project_name = "cloud-custodian"
          EOF
          echo "📝 Created terraform.tfvars for bootstrap"
      
      - name: Ensure Terraform formatting (auto-fix)
        run: |
          echo "🔍 Checking Terraform formatting..."
          if ! terraform fmt -check -recursive; then
            echo "⚠️ Terraform format issues found — auto-formatting files..."
            terraform fmt -recursive
            echo "✅ Files formatted"
          else
            echo "✅ Terraform formatting OK"
          fi
      
      - name: Cleanup Existing Resources (Optional)
        if: github.event.inputs.cleanup_existing == 'true'
        run: |
          echo "🧹 Cleaning up existing resources without state tracking..."
          
          # Get account ID
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          
          # Remove role policy attachments
          echo "🔗 Detaching policies from existing role..."
          aws iam detach-role-policy --role-name "GitHubActions-CloudCustodian-Role" --policy-arn "arn:aws:iam::${ACCOUNT_ID}:policy/CloudCustodianPolicy" 2>/dev/null || echo "Policy not attached"
          aws iam detach-role-policy --role-name "GitHubActions-CloudCustodian-Role" --policy-arn "arn:aws:iam::aws:policy/ReadOnlyAccess" 2>/dev/null || echo "ReadOnly policy not attached"
          
          # Delete existing resources
          echo "🗑️ Deleting existing IAM role..."
          aws iam delete-role --role-name "GitHubActions-CloudCustodian-Role" 2>/dev/null || echo "Role doesn't exist"
          
          echo "🗑️ Deleting existing CloudCustodian policy..."
          aws iam delete-policy --policy-arn "arn:aws:iam::${ACCOUNT_ID}:policy/CloudCustodianPolicy" 2>/dev/null || echo "Policy doesn't exist"
          
          # Delete OIDC provider
          echo "🗑️ Deleting existing OIDC provider..."
          OIDC_PROVIDERS=$(aws iam list-open-id-connect-providers --query 'OpenIDConnectProviderList[?contains(Arn, `token.actions.githubusercontent.com`)].Arn' --output text 2>/dev/null || echo "")
          if [ -n "$OIDC_PROVIDERS" ]; then
            for arn in $OIDC_PROVIDERS; do
              aws iam delete-open-id-connect-provider --open-id-connect-provider-arn "$arn" 2>/dev/null || echo "OIDC provider doesn't exist"
            done
          fi
          
          echo "✅ Cleanup completed"
      
      - name: Ensure S3 Backend Bucket Exists
        run: |
          echo "🪣 Ensuring S3 bucket exists for Terraform state..."
          
          # Check if bucket exists
          if aws s3 ls "s3://${{ env.TF_STATE_BUCKET }}" 2>/dev/null; then
            echo "✅ S3 bucket ${{ env.TF_STATE_BUCKET }} already exists"
          else
            echo "🆕 Creating S3 bucket ${{ env.TF_STATE_BUCKET }}..."
            
            # Create bucket
            aws s3 mb "s3://${{ env.TF_STATE_BUCKET }}" --region ${{ env.AWS_REGION }}
            
            # Enable versioning
            echo "🔄 Enabling versioning..."
            aws s3api put-bucket-versioning \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --versioning-configuration Status=Enabled
            
            # Enable encryption
            echo "🔒 Enabling encryption..."
            aws s3api put-bucket-encryption \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --server-side-encryption-configuration '{
                "Rules": [
                  {
                    "ApplyServerSideEncryptionByDefault": {
                      "SSEAlgorithm": "AES256"
                    }
                  }
                ]
              }'
            
            # Block public access
            echo "🚫 Blocking public access..."
            aws s3api put-public-access-block \
              --bucket ${{ env.TF_STATE_BUCKET }} \
              --public-access-block-configuration '{
                "BlockPublicAcls": true,
                "IgnorePublicAcls": true,
                "BlockPublicPolicy": true,
                "RestrictPublicBuckets": true
              }'
            
            echo "✅ S3 bucket created and configured"
          fi
      
      - name: Terraform Init (S3 backend)
        run: |
          echo "🔄 Initializing Terraform for bootstrap with S3 backend..."
          terraform init -upgrade
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        id: plan
        run: |
          echo "📋 Planning OIDC provider and IAM role creation..."
          echo "🔍 Terraform will show what resources will be created/updated/destroyed..."
          
          # Run terraform plan and capture exit code
          set +e  # Don't exit on error
          terraform plan -detailed-exitcode -out=tfplan
          PLAN_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          echo "plan_exit_code=$PLAN_EXIT_CODE" >> $GITHUB_OUTPUT
          
          if [ $PLAN_EXIT_CODE -eq 0 ]; then
            echo "✅ No changes needed - resources already exist and are up to date"
            echo "plan_status=no-changes" >> $GITHUB_OUTPUT
          elif [ $PLAN_EXIT_CODE -eq 2 ]; then
            echo "🔄 Changes detected - will create/update resources"
            echo "plan_status=changes-detected" >> $GITHUB_OUTPUT
          else
            echo "❌ Terraform plan failed with exit code $PLAN_EXIT_CODE"
            echo "plan_status=failed" >> $GITHUB_OUTPUT
            exit $PLAN_EXIT_CODE
          fi
          
          # Ensure step succeeds for valid exit codes (0 or 2)
          exit 0
      
      - name: Terraform Apply
        if: steps.plan.outputs.plan_status == 'changes-detected' || steps.plan.outputs.plan_status == 'no-changes'
        run: |
          if [ "${{ steps.plan.outputs.plan_status }}" == "no-changes" ]; then
            echo "✅ No changes to apply - infrastructure is already up to date"
          else
            echo "🚀 Applying Terraform plan to create/update resources..."
            terraform apply -auto-approve tfplan
            echo "✅ Bootstrap completed successfully!"
          fi
      
      - name: Extract Role ARN
        id: role_arn
        if: always() && (steps.plan.outputs.plan_status == 'changes-detected' || steps.plan.outputs.plan_status == 'no-changes')
        run: |
          echo "🔑 Extracting GitHub Actions Role ARN..."
          ROLE_ARN=$(terraform output -raw github_actions_role_arn 2>/dev/null || echo "")
          
          if [ -n "$ROLE_ARN" ]; then
            echo "role_arn=$ROLE_ARN" >> $GITHUB_OUTPUT
            echo "🔑 GitHub Actions Role ARN: $ROLE_ARN"
          else
            echo "⚠️ Could not extract role ARN - this may be expected if resources don't exist yet"
            # Try to get it from planned outputs if available
            echo "role_arn=arn:aws:iam::$(aws sts get-caller-identity --query Account --output text):role/GitHubActions-CloudCustodian-Role" >> $GITHUB_OUTPUT
          fi
      
      - name: Display Next Steps
        if: always() && (steps.plan.outputs.plan_status == 'changes-detected' || steps.plan.outputs.plan_status == 'no-changes')
        run: |
          echo "📋 Bootstrap Summary" >> $GITHUB_STEP_SUMMARY
          echo "===================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.plan.outputs.plan_status }}" == "no-changes" ]; then
            echo "✅ **Infrastructure Already Up-to-Date**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **OIDC Provider Exists**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **IAM Role Exists**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Cloud Custodian Policies Attached**" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **OIDC Provider Created/Updated**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **IAM Role Created/Updated**" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Cloud Custodian Policies Attached**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔑 GitHub Secret Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Add the following repository secret:" >> $GITHUB_STEP_SUMMARY
          echo "- **Name**: \`AWS_ROLE_ARN\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Value**: \`${{ steps.role_arn.outputs.role_arn }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔒 Security Improvement" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "After adding the AWS_ROLE_ARN secret:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ All future workflows will use OIDC authentication" >> $GITHUB_STEP_SUMMARY
          echo "2. 🗑️ You can safely delete ACCESS_KEY and SECRET_ACCESS_KEY secrets" >> $GITHUB_STEP_SUMMARY
          echo "3. 🛡️ No more long-term AWS credentials in GitHub" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Add the AWS_ROLE_ARN secret to your repository" >> $GITHUB_STEP_SUMMARY
          echo "2. Run the 'Deploy Cloud Custodian Infrastructure' workflow" >> $GITHUB_STEP_SUMMARY
          echo "3. Start using Cloud Custodian policies with OIDC authentication" >> $GITHUB_STEP_SUMMARY
      
      - name: Save Bootstrap State Info
        if: always() && (steps.plan.outputs.plan_status == 'changes-detected' || steps.plan.outputs.plan_status == 'no-changes')
        run: |
          echo "🏗️ Bootstrap completed on: $(date)" > bootstrap-info.txt
          echo "🔑 Role ARN: ${{ steps.role_arn.outputs.role_arn }}" >> bootstrap-info.txt
          echo "📍 AWS Region: ${{ env.AWS_REGION }}" >> bootstrap-info.txt
          echo "📦 Repository: ${{ github.repository }}" >> bootstrap-info.txt
          echo "📊 Plan Status: ${{ steps.plan.outputs.plan_status }}" >> bootstrap-info.txt
      
      - name: Upload Bootstrap Info
        if: always() && (steps.plan.outputs.plan_status == 'changes-detected' || steps.plan.outputs.plan_status == 'no-changes')
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-info
          path: terraform-bootstrap/bootstrap-info.txt
          retention-days: 30

  validation:
    name: 'Validate Bootstrap Requirements'
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_bootstrap != 'bootstrap'
    
    steps:
      - name: Invalid Confirmation
        run: |
          echo "❌ Bootstrap not confirmed"
          echo ""
          echo "To run the bootstrap process:"
          echo "1. Go to Actions → 'Bootstrap OIDC Authentication'"
          echo "2. Click 'Run workflow'"
          echo "3. Type 'bootstrap' in the confirmation field"
          echo "4. Click 'Run workflow'"
          echo ""
          echo "⚠️  This will create AWS resources using your access keys"
          echo "🔒 After bootstrap, all operations will use secure OIDC authentication"
          exit 1