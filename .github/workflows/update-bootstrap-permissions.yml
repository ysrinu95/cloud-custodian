name: Update Bootstrap IAM Permissions

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
        - plan
        - apply

env:
  AWS_REGION: 'us-east-1'
  TF_VAR_aws_region: 'us-east-1'
  TF_VAR_github_repository: 'ysrinu95/cloud-custodian'
  TF_VAR_github_actions_role_name: 'GitHubActions-CloudCustodian-Role'

jobs:
  update-bootstrap:
    name: 'Update Bootstrap Permissions'
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '>=1.6'
      
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Bootstrap-Update-${{ github.run_number }}
      
      - name: Verify AWS Connection
        run: |
          echo "🔍 Verifying AWS connection..."
          aws sts get-caller-identity
          echo "✅ AWS connection verified"
      
      - name: Check Current Permissions
        run: |
          echo "🔍 Checking current IAM permissions..."
          
          # List attached policies
          echo "📋 Currently attached policies:"
          aws iam list-attached-role-policies --role-name GitHubActions-CloudCustodian-Role
          
          # Check if CloudCustodianPolicy exists and what permissions it has
          POLICY_ARN=$(aws iam list-attached-role-policies --role-name GitHubActions-CloudCustodian-Role --query 'AttachedPolicies[?PolicyName==`CloudCustodianPolicy`].PolicyArn' --output text)
          
          if [ -n "$POLICY_ARN" ]; then
            echo "📋 Found CloudCustodianPolicy: $POLICY_ARN"
            CURRENT_VERSION=$(aws iam get-policy --policy-arn "$POLICY_ARN" --query 'Policy.DefaultVersionId' --output text)
            echo "📋 Current version: $CURRENT_VERSION"
            
            # Check for specific permissions
            echo "🔍 Checking for iam:CreatePolicyVersion permission..."
            aws iam get-policy-version --policy-arn "$POLICY_ARN" --version-id "$CURRENT_VERSION" --query 'PolicyVersion.Document.Statement[0].Action' --output json | grep -q "iam:CreatePolicyVersion" && echo "✅ Has iam:CreatePolicyVersion" || echo "❌ Missing iam:CreatePolicyVersion"
            
            echo "🔍 Checking for lambda:TagResource permission..."
            aws iam get-policy-version --policy-arn "$POLICY_ARN" --version-id "$CURRENT_VERSION" --query 'PolicyVersion.Document.Statement[0].Action' --output json | grep -q "lambda:TagResource" && echo "✅ Has lambda:TagResource" || echo "❌ Missing lambda:TagResource"
          else
            echo "❌ CloudCustodianPolicy not found"
          fi
      
      - name: Terraform Init
        working-directory: terraform-bootstrap
        run: |
          echo "🔧 Initializing Terraform..."
          terraform init
          echo "✅ Terraform initialized"
      
      - name: Terraform Plan
        working-directory: terraform-bootstrap
        run: |
          echo "📋 Planning Terraform changes..."
          terraform plan -out=tfplan
          echo "✅ Terraform plan completed"
      
      - name: Show Plan Summary
        working-directory: terraform-bootstrap
        run: |
          echo "📊 Terraform Plan Summary:" >> $GITHUB_STEP_SUMMARY
          echo "=========================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Plan Output:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          terraform show -no-color tfplan | head -50 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Also show in console for debugging
          echo "📋 Plan Details:"
          terraform show -no-color tfplan
      
      - name: Bootstrap Permission Fix
        if: github.event.inputs.action == 'apply'
        run: |
          echo "🔧 Bootstrap Permission Fix - Adding temporary policy version permissions..."
          
          # Always create and attach the temporary policy to ensure we have the permissions
          cat > temp_policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "iam:CreatePolicyVersion",
                  "iam:DeletePolicyVersion",
                  "iam:GetPolicyVersion",
                  "iam:ListPolicyVersions",
                  "iam:SetDefaultPolicyVersion"
                ],
                "Resource": "*"
              }
            ]
          }
          EOF
          
          # Create a unique temporary policy name
          TIMESTAMP=$(date +%s)
          TEMP_POLICY_NAME="TempPolicyVersionManagement-$TIMESTAMP"
          
          echo "📝 Creating temporary policy: $TEMP_POLICY_NAME"
          TEMP_POLICY_ARN=$(aws iam create-policy \
            --policy-name "$TEMP_POLICY_NAME" \
            --policy-document file://temp_policy.json \
            --query 'Policy.Arn' \
            --output text)
          
          echo "✅ Created temporary policy: $TEMP_POLICY_ARN"
          
          # Attach the temporary policy to the GitHub Actions role
          echo "🔗 Attaching temporary policy to GitHubActions-CloudCustodian-Role..."
          aws iam attach-role-policy \
            --role-name GitHubActions-CloudCustodian-Role \
            --policy-arn "$TEMP_POLICY_ARN"
          
          echo "✅ Attached temporary policy successfully"
          
          # Wait for permission propagation
          echo "⏳ Waiting 15 seconds for permission propagation..."
          sleep 15
          
          # Store for cleanup
          echo "TEMP_POLICY_ARN=$TEMP_POLICY_ARN" >> $GITHUB_ENV
          echo "🎯 Bootstrap permissions ready for Terraform apply"

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform-bootstrap
        run: |
          echo "🚀 Applying Terraform changes..."
          terraform apply -auto-approve tfplan
          echo "✅ Terraform apply completed"

      - name: Cleanup Temporary Policy
        if: github.event.inputs.action == 'apply'
        run: |
          echo "🧹 Cleaning up temporary policy..."
          
          if [ -n "$TEMP_POLICY_ARN" ]; then
            echo "🔄 Detaching temporary policy: $TEMP_POLICY_ARN"
            aws iam detach-role-policy \
              --role-name GitHubActions-CloudCustodian-Role \
              --policy-arn "$TEMP_POLICY_ARN" || echo "⚠️ Policy already detached"
            
            echo "🗑️ Deleting temporary policy: $TEMP_POLICY_ARN"
            aws iam delete-policy --policy-arn "$TEMP_POLICY_ARN" || echo "⚠️ Policy already deleted"
            
            echo "✅ Temporary policy cleaned up successfully"
          else
            echo "ℹ️ No temporary policy to clean up"
          fi
      
      - name: Verify Updated Permissions
        if: github.event.inputs.action == 'apply'
        run: |
          echo "🔍 Verifying updated IAM permissions..."
          
          # Check if the role has the new Lambda permissions
          POLICY_ARN=$(aws iam list-attached-role-policies --role-name GitHubActions-CloudCustodian-Role --query 'AttachedPolicies[?PolicyName==`CloudCustodianPolicy`].PolicyArn' --output text)
          
          if [ -n "$POLICY_ARN" ]; then
            echo "✅ CloudCustodianPolicy found: $POLICY_ARN"
            
            # Get the policy version
            POLICY_VERSION=$(aws iam get-policy --policy-arn "$POLICY_ARN" --query 'Policy.DefaultVersionId' --output text)
            echo "📋 Policy version: $POLICY_VERSION"
            
            # Check if lambda:TagResource is in the policy
            aws iam get-policy-version --policy-arn "$POLICY_ARN" --version-id "$POLICY_VERSION" --query 'PolicyVersion.Document.Statement[0].Action' --output json | grep -q "lambda:TagResource"
            
            if [ $? -eq 0 ]; then
              echo "✅ lambda:TagResource permission found in policy"
            else
              echo "❌ lambda:TagResource permission not found in policy"
            fi
          else
            echo "❌ CloudCustodianPolicy not found"
          fi
      
      - name: Generate Summary
        if: always()
        run: |
          echo "🔧 Bootstrap IAM Permission Update" >> $GITHUB_STEP_SUMMARY
          echo "==================================" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Action**: ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event.inputs.action }}" == "apply" ]; then
            echo "## ✅ Updated Permissions" >> $GITHUB_STEP_SUMMARY
            echo "- **lambda:TagResource** - Tag Lambda functions during deployment" >> $GITHUB_STEP_SUMMARY
            echo "- **lambda:UntagResource** - Remove tags from Lambda functions" >> $GITHUB_STEP_SUMMARY
            echo "- **lambda:ListTags** - List tags on Lambda functions" >> $GITHUB_STEP_SUMMARY
            echo "- **events:TagResource** - Tag CloudWatch Event rules" >> $GITHUB_STEP_SUMMARY
            echo "- **events:UntagResource** - Remove tags from CloudWatch Event rules" >> $GITHUB_STEP_SUMMARY
            echo "- **events:ListTagsForResource** - List tags on CloudWatch Event rules" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## 🎯 Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "- **Lambda deployment should now work** without permission errors" >> $GITHUB_STEP_SUMMARY
            echo "- **Re-run the Deploy Lambda Functions workflow** to deploy Cloud Custodian policies" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 📋 Plan Only" >> $GITHUB_STEP_SUMMARY
            echo "Run with 'apply' action to update the IAM permissions." >> $GITHUB_STEP_SUMMARY
          fi