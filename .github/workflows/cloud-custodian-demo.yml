name: Cloud Custodian Demo & Policy Management

on:
  workflow_dispatch:
    inputs:
      operation_type:
        description: 'Type of operation to perform'
        required: true
        default: 'validate'
        type: choice
        options:
        # Policy Management
        - validate
        - deploy-updated
        - deploy-all
        - deploy-mailer
        - cleanup
        # Verification & Setup
        - verify-deployment
        - complete-setup-validation
        - deployment-report
        # Security Demos (Real AWS Service Integration)
        - demo-guardduty-real
        - demo-config-real
        - demo-securityhub-real
        - demo-macie-real
        - demo-access-analyzer-real
        - demo-s3-access-logs-real
        - demo-cloudtrail-security-real
        - demo-security-summary-real
        - demo-all-security-real
        # Resource Demos
        - demo-ec2-public
        - demo-rds-public
        - demo-ebs-unencrypted
        - demo-step-functions
        # Cleanup Operations
        - cleanup-demo-resources
        - cleanup-security-tests
        - cleanup-comprehensive
        - cleanup-scan
      target_accounts:
        description: 'Target accounts (comma-separated, or "all")'
        required: false
        default: 'engg'
        type: string
      dry_run:
        description: 'Run in dry-run mode (for policy operations)'
        required: false
        default: true
        type: boolean
      regions:
        description: 'Target regions (comma-separated)'
        required: false
        default: 'us-east-1'
        type: string
      monitoring_duration:
        description: 'Monitoring duration for security demos (minutes)'
        required: false
        default: '15'
        type: string

  push:
    branches:
      - main
    paths:
      - 'policies/**'
      - '.github/workflows/**'
      
  pull_request:
    branches:
      - main
    paths:
      - 'policies/**'
      - '.github/workflows/**'

env:
  PYTHON_VERSION: '3.11'
  AWS_REGION: 'us-east-1'

jobs:
  validate:
    name: 'Validate Policies'
    runs-on: ubuntu-latest
    if: github.event.inputs.operation_type == 'validate' || github.event_name == 'push' || github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Cloud Custodian
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
      
      - name: Validate Policy Syntax
        run: |
          echo "🔍 Validating Cloud Custodian policies..."
          
          # Find all policy files
          POLICY_FILES=$(find policies -name "*.yml" -o -name "*.yaml" 2>/dev/null || echo "")
          
          if [[ -z "$POLICY_FILES" ]]; then
            echo "⚠️  No policy files found in policies/ directory"
            exit 0
          fi
          
          echo "📋 Found policy files:"
          for file in $POLICY_FILES; do
            echo "   • $file"
          done
          echo ""
          
          # Validate each policy file
          VALIDATION_ERRORS=0
          for policy_file in $POLICY_FILES; do
            echo "🔍 Validating: $policy_file"
            if custodian validate "$policy_file"; then
              echo "✅ Valid: $policy_file"
            else
              echo "❌ Invalid: $policy_file"
              VALIDATION_ERRORS=$((VALIDATION_ERRORS + 1))
            fi
            echo ""
          done
          
          if [[ $VALIDATION_ERRORS -gt 0 ]]; then
            echo "❌ Validation failed with $VALIDATION_ERRORS error(s)"
            exit 1
          else
            echo "✅ All policies passed validation"
          fi

