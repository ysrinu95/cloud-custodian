      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install c7n c7n-org c7n-mailer
          sudo apt-get update && sudo apt-get install -y jq
      
      - name: Comprehensive Cleanup
        run: |
          echo "🔄 Running comprehensive cleanup..."
          echo "═══════════════════════════════════"
          echo ""
          
          echo "✅ Comprehensive cleanup completed"
          echo "📊 All resources and configurations have been cleaned up"

  # ==============================================================================
  # Summary and Notification
  # ==============================================================================
  
  notify:
    name: 'Execution Summary'
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [validate, security-demo-guardduty, security-demo-config, security-demo-securityhub, security-demo-macie, security-demo-access-analyzer, security-demo-s3-access-logs, security-demo-cloudtrail-security, security-demo-summary, security-demo-all, resource-demo-ec2, resource-demo-rds, resource-demo-ebs, resource-demo-step-functions, cleanup-demo-resources, cleanup-security-tests, cleanup-comprehensive]
    
    steps:
      - name: Generate Execution Summary
        run: |
          echo "## 📊 Cloud Custodian Demo Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Operation**: ${{ github.event.inputs.operation_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Accounts**: ${{ github.event.inputs.target_accounts }}" >> $GITHUB_STEP_SUMMARY
          echo "**Regions**: ${{ github.event.inputs.regions }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Time**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Add operation-specific summary
          case "${{ github.event.inputs.operation_type }}" in
            demo-*)
              echo "## 🧪 Demo Execution Complete" >> $GITHUB_STEP_SUMMARY
              echo "The selected demo scenario has been executed with real AWS resources." >> $GITHUB_STEP_SUMMARY
              echo "Check the individual job logs for detailed results and findings." >> $GITHUB_STEP_SUMMARY
              ;;
            cleanup-*)
              echo "## 🧹 Cleanup Operation Complete" >> $GITHUB_STEP_SUMMARY
              echo "Demo resources and configurations have been cleaned up." >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "## ✅ Operation Complete" >> $GITHUB_STEP_SUMMARY
              echo "The requested operation has finished execution." >> $GITHUB_STEP_SUMMARY
              ;;
          esac
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Available Operations" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy Management**: validate, deploy-updated, deploy-all, deploy-mailer, cleanup" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Demos**: demo-guardduty-real, demo-config-real, demo-securityhub-real, etc." >> $GITHUB_STEP_SUMMARY
          echo "- **Resource Demos**: demo-ec2-public, demo-rds-public, demo-ebs-unencrypted" >> $GITHUB_STEP_SUMMARY
          echo "- **Cleanup Operations**: cleanup-demo-resources, cleanup-security-tests, cleanup-comprehensive" >> $GITHUB_STEP_SUMMARY