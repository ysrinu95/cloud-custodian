policies:
  # Real-time EC2 monitoring - triggers on instance state changes
  - name: ec2-untagged-instances-realtime
    description: |
      Monitor EC2 instances in real-time and automatically tag untagged instances.
      Triggers on EC2 instance launch events.
    resource: aws.ec2
    mode:
      type: cloudtrail
      events:
        - RunInstances
    filters:
      - "tag:Name": absent
      - "tag:Environment": absent
    actions:
      - type: tag
        key: AutoTagged
        value: 'true'
      - type: tag
        key: Environment
        value: 'unspecified'
      - type: notify
        template: default
        priority_header: '1'
        subject: "EC2 Instance Auto-Tagged - {{ account }} {{ region }}"
        to:
          - resource-owner
        transport:
          type: sns
          topic: arn:aws:sns:{region}:{account_id}:cloud-custodian-notifications

  # Real-time S3 bucket monitoring - triggers on bucket creation
  - name: s3-public-bucket-remediation-realtime
    description: |
      Monitor S3 buckets in real-time and automatically secure public buckets.
      Triggers when S3 buckets are created or modified.
    resource: aws.s3
    mode:
      type: cloudtrail
      events:
        - CreateBucket
    filters:
      - type: check-public-block
        BlockPublicAcls: false
    actions:
      - type: set-public-block
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      - type: notify
        template: default
        priority_header: '2'
        subject: "S3 Bucket Secured - {{ account }} {{ region }}"
        to:
          - resource-owner
        transport:
          type: sns
          topic: arn:aws:sns:{region}:{account_id}:cloud-custodian-notifications

  # Real-time Security Group monitoring - triggers on rule changes
  - name: security-group-ssh-remediation-realtime
    description: |
      Monitor security groups in real-time and remove unrestricted SSH access.
      Triggers when security group rules are modified.
    resource: aws.security-group
    mode:
      type: periodic
      schedule: "rate(5 minutes)"
    filters:
      - type: ingress
        Ports: [22]
        Cidr: "0.0.0.0/0"
    actions:
      - type: remove-permissions
        ingress: matched
      - type: notify
        template: default
        priority_header: '3'
        subject: "Security Group SSH Access Restricted - {{ account }} {{ region }}"
        to:
          - resource-owner
        transport:
          type: sns
          topic: arn:aws:sns:{region}:{account_id}:cloud-custodian-notifications

  # Real-time IAM monitoring - triggers on policy/role changes
  - name: iam-policy-monitoring-realtime
    description: |
      Monitor IAM policies in real-time for overly permissive policies.
      Triggers when IAM policies are created or modified.
    resource: aws.iam-policy
    mode:
      type: periodic
      schedule: "rate(5 minutes)"
    filters:
      - type: has-allow-all
    actions:
      - type: notify
        template: default
        priority_header: '1'
        subject: "IAM Policy Alert - Overly Permissive Policy Detected - {{ account }}"
        to:
          - security-team
        transport:
          type: sns
          topic: arn:aws:sns:{region}:{account_id}:cloud-custodian-notifications

  # Scheduled compliance check - runs every hour
  - name: ebs-unencrypted-volumes-scheduled
    description: |
      Scheduled check for unencrypted EBS volumes.
      Runs every hour to ensure continuous compliance.
    resource: aws.ebs
    mode:
      type: periodic
      schedule: "rate(1 hour)"
    filters:
      - Encrypted: false
      - State: available
    actions:
      - type: tag
        key: ComplianceStatus
        value: 'NonCompliant-Unencrypted'
      - type: tag
        key: AutoRemediation
        value: 'Required'
      - type: notify
        template: default
        priority_header: '2'
        subject: "EBS Compliance Alert - Unencrypted Volumes Found - {{ account }}"
        to:
          - security-team
        transport:
          type: sns
          topic: arn:aws:sns:{region}:{account_id}:cloud-custodian-notifications

  # Real-time RDS monitoring - triggers on DB instance events
  - name: rds-public-access-remediation-realtime
    description: |
      Monitor RDS instances in real-time and flag publicly accessible databases.
      Triggers when RDS instances are created or modified.
    resource: aws.rds
    mode:
      type: cloudtrail
      events:
        - CreateDBInstance
    filters:
      - PubliclyAccessible: true
    actions:
      - type: tag
        key: SecurityAlert
        value: 'PubliclyAccessible'
      - type: tag
        key: ReviewRequired
        value: 'Immediate'
      - type: notify
        template: default
        priority_header: '1'
        subject: "RDS Security Alert - Publicly Accessible Database - {{ account }}"
        to:
          - security-team
          - database-team
        transport:
          type: sns
          topic: arn:aws:sns:{region}:{account_id}:cloud-custodian-notifications