policies:
  # Find unused EC2 instances
  - name: ec2-low-utilization
    description: |
      Find EC2 instances with low CPU utilization over the past 14 days.
      These might be candidates for downsizing or termination.
    resource: aws.ec2
    filters:
      # Instance is running
      - "State.Name": running
      # Low CPU utilization
      - type: metrics
        name: CPUUtilization
        days: 14
        value: 5
        op: less-than
    actions:
      # Tag for review
      - type: tag
        key: CostOptimization
        value: LowUtilization

  # Find unattached EBS volumes
  - name: ebs-unattached-volumes
    description: |
      Find EBS volumes that are not attached to any instance
      and are older than 7 days. These incur storage costs.
    resource: aws.ebs
    filters:
      # Volume is available (not attached)
      - "State": available
      # Older than 7 days
      - type: age
        days: 7
    actions:
      # Create snapshot for backup
      - type: snapshot
        copy-tags: true
      # Tag for potential deletion
      - type: tag
        key: CostOptimization
        value: UnattachedVolume

  # Find old snapshots
  - name: ebs-old-snapshots
    description: |
      Find EBS snapshots older than 90 days that might be
      safe to delete for cost savings.
    resource: aws.ebs-snapshot
    filters:
      # Owned by this account
      - "OwnerId": self
      # Older than 90 days
      - type: age
        days: 90
      # Not used for AMI creation
      - "Description": not-regex
      - .*Created by CreateImage.*
    actions:
      # Tag for review
      - type: tag
        key: CostOptimization
        value: OldSnapshot

  # Find oversized RDS instances
  - name: rds-oversized-instances
    description: |
      Find RDS instances that might be oversized based on
      CPU and connection metrics.
    resource: aws.rds
    filters:
      # Low CPU utilization
      - type: metrics
        name: CPUUtilization
        days: 14
        value: 20
        op: less-than
      # Low connection count
      - type: metrics
        name: DatabaseConnections
        days: 14
        value: 10
        op: less-than
    actions:
      # Tag for rightsizing review
      - type: tag
        key: CostOptimization
        value: OverSizedRDS

  # Find unused Elastic Load Balancers
  - name: elb-no-targets
    description: |
      Find Classic Load Balancers with no registered instances.
      These incur costs without providing value.
    resource: aws.elb
    filters:
      # No instances registered
      - "Instances": []
    actions:
      # Tag for review
      - type: tag
        key: CostOptimization
        value: UnusedELB

  # Find unused Application Load Balancers
  - name: elbv2-no-targets
    description: |
      Find Application/Network Load Balancers with no targets
      or very low request count.
    resource: aws.app-elb
    filters:
      # Low request count
      - type: metrics
        name: RequestCount
        days: 7
        value: 100
        op: less-than
    actions:
      # Tag for review
      - type: tag
        key: CostOptimization
        value: LowTrafficALB

  # Find unused Reserved Instances
  - name: reserved-instances-unused
    description: |
      Find Reserved Instances that are not being fully utilized.
      These represent wasted pre-paid capacity.
    resource: aws.reserved-instances
    filters:
      # Reserved instance is active
      - "State": active
      # Usage is low (this would need custom logic)
      - type: value
        key: InstanceCount
        op: greater-than
        value: 0
    actions:
      # Tag for review
      - type: tag
        key: CostOptimization
        value: UnusedReservation

  # Find large CloudWatch log groups
  - name: cloudwatch-large-log-groups
    description: |
      Find CloudWatch log groups that are very large and might
      benefit from log retention policy optimization.
    resource: aws.log-group
    filters:
      # Large stored bytes (over 10GB)
      - type: value
        key: storedBytes
        op: greater-than
        value: 10737418240  # 10GB in bytes
    actions:
      # Tag for retention review
      - type: tag
        key: CostOptimization
        value: LargeLogGroup

  # Find idle Lambda functions
  - name: lambda-unused-functions
    description: |
      Find Lambda functions that haven't been invoked recently.
      While Lambda has no cost when not running, these might be cleanup candidates.
    resource: aws.lambda
    filters:
      # No recent invocations
      - type: metrics
        name: Invocations
        days: 30
        value: 1
        op: less-than
    actions:
      # Tag for review
      - type: tag
        key: CostOptimization
        value: UnusedLambda