policies:
  # Daily security check: Public S3 buckets
  - name: s3-public-buckets
    description: |
      Find S3 buckets that are publicly readable or writable.
      This is a critical security issue that needs immediate attention.
    resource: aws.s3
    filters:
      # Bucket allows public read
      - type: bucket-public-access-block
        BlockPublicAcls: false
      - type: bucket-public-access-block
        BlockPublicPolicy: false
    actions:
      # Immediately block public access
      - type: set-public-access-block
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Tag for urgent review
      - type: tag
        key: SecurityAlert
        value: PublicBucketBlocked

  # Security Group monitoring
  - name: security-groups-wide-open
    description: |
      Find security groups with rules that allow all traffic (0.0.0.0/0)
      on sensitive ports. This is a security risk.
    resource: aws.security-group
    filters:
      # Allow all traffic from anywhere on common ports
      - or:
        - type: ingress
          Ports: [80, 443, 22, 3389, 3306, 5432]
          Cidr: "0.0.0.0/0"
    actions:
      # Tag for immediate review
      - type: tag
        key: SecurityReview
        value: WideOpenPorts

  # Monitor admin access
  - name: iam-admin-access-check
    description: |
      Find IAM users and roles with admin-level permissions.
      These should be regularly reviewed for security.
    resource: aws.iam-user
    filters:
      # Has policies with admin access
      - type: policy
        key: PolicyArn
        value: "arn:aws:iam::aws:policy/AdministratorAccess"
        op: in
    actions:
      # Tag for review
      - type: tag
        key: PrivilegeReview
        value: AdminAccess

  # Check for unused NAT Gateways
  - name: nat-gateways-unused
    description: |
      Find NAT Gateways that might not be actively used.
      These are expensive and should be reviewed for cost optimization.
    resource: aws.nat-gateway
    filters:
      # Available state
      - "State": available
    actions:
      # Tag for cost review
      - type: tag
        key: CostReview
        value: NATGatewayUsage

  # Monitor CloudTrail configuration
  - name: cloudtrail-not-enabled
    description: |
      Ensure CloudTrail is enabled for audit logging.
      This is required for compliance and security monitoring.
    resource: aws.account
    filters:
      # Check if CloudTrail is configured
      - type: check-cloudtrail
        global-events: true
        multi-region: true
        running: true
    actions:
      # This would typically trigger an alert
      - type: tag
        key: ComplianceAlert
        value: CloudTrailNotConfigured